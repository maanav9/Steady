  A.trPick = d => { st.pick = st.pick === d.id ? null : d.id; st.size = TREAT_PRESETS.find(p => p.id === d.id).def; refreshSheet(); };
  A.trSize = d => { st.size = +d.i; refreshSheet(); };
  A.trInstead = () => { st.instead = !st.instead; refreshSheet(); };
  A.trLog = () => {
    const pr = TREAT_PRESETS.find(p => p.id === st.pick), op = pr.opts[st.size];
    if (pr.food) logFood(k, pr.food, op[0], 'treat', `${pr.name} (${op[1].toLowerCase()})`); else logRecipe(k, pr.recipe, op[0], 'treat');
    const L = dayLog(k), it = L.items[L.items.length - 1]; it.kind = 'treat';
    const pl = planned();
    if (pl && st.instead) { it.mealId = pl.id; it.r = pl.r; }
    save(); closeAllSheets(); refresh();
    toast(pl && st.instead ? 'You’ve had your planned treat. You’re still within your weekly range.' : treatLoggedMessage(k, it));
  };
}

function setsSummary(ex, sg, sets) {

/* ---------- body ---------- */
function progBody() {

  const span = daysBetween(tr.firstDate, todayKey()) + 1;
  const n = UI.range === 'all' ? Math.max(14, span) : Math.max(14, Math.min(+UI.range, span + 3));
  const days = lastNDays(n);
  const daily = days.map((d, i) => S.weights[d] != null ? { i, y: S.weights[d] } : null);
  const avgPts = days.map((d, i) => { const w = days.slice(Math.max(0, i - 6), i + 1).map(x => S.weights[x]).filter(v => v != null); const has = Object.keys(S.weights).some(k => k <= d && k > addDays(d, -7)); return has && w.length ? { i, y: avg(w) } : null; });

  const rv = targetReview();

  return `<div class="group pad stack">
      <div class="stat-row">${stat('7-day average', fmtKg(tr.current), 'kg')}${stat('Since the start', signed(tr.change), 'kg')}${stat('Per week', pace, tr.rate == null ? '' : 'kg')}</div>

      <div class="scroll-x" style="margin-top:2px">${chip('4 weeks', UI.range === '28', 'range', 'data-v="28"')}${chip('3 months', UI.range === '90', 'range', 'data-v="90"')}${chip('All', UI.range === 'all', 'range', 'data-v="all"')}</div>
    </div>
    <div class="group pad note">${kindTag('personal')}<p class="h3">${tr.rate == null ? 'Building your trend' : tr.inGoal ? 'In your goal range' : tr.rate < -0.05 ? 'Moving gradually towards your goal' : 'Holding steady'}</p>
      <p class="small sec">${tr.rate == null ? `${tr.entries} weigh-ins so far. Two weeks of two or three a week and the trend settles.` : tr.inGoal ? `Your 7-day average is within ${fmtKg(p.goalLow)} to ${fmtKg(p.goalHigh)} kg. ${p.phase === 'maintain' ? 'You’re in maintenance: the aim now is to stay here and keep getting stronger.' : 'After two weeks here, Steady suggests moving to maintenance.'}` : tr.rate < -0.05 ? `About ${Math.abs(tr.rate).toFixed(2)} kg a week, a gentle pace that protects muscle.${tr.eta ? ' At this rate you’d reach your goal range around ' + fmtDate(tr.eta) + '.' : ''}` : 'Weight naturally moves up and down by a kilo or so with water, salt and hormones. The 4-week trend is what counts.'}</p></div>

/* ---------- strength ---------- */
function progStrength() {
  const lifts = KEY_LIFTS.map(kl => {
    const id = kl.ids.slice().sort((a, b) => exHistory(b).length - exHistory(a).length)[0];
    const h = exHistory(id).filter(x => x.sets.some(s => s.w > 0));
    if (h.length < 2) return null;
    const pts = h.map(x => Math.max(...x.sets.map(s => s.w || 0)));
    const ex = exById(id), last = h[h.length - 1], first = h[0];
    const top = last.sets.filter(s => (s.w || 0) === pts[pts.length - 1]);
    return `<button class="item" data-a="exDetail" data-id="${id}" style="align-items:center"><div class="grow"><div class="t">${esc(ex.name)}</div><div class="s num">Now ${fmtW(pts[pts.length - 1])} kg × ${top.map(s => s.r).join(', ')}${pts[pts.length - 1] > pts[0] ? `, up ${fmtW(pts[pts.length - 1] - pts[0])} kg since ${fmtDate(first.date)}` : ''}</div></div>
      <span style="width:96px;flex:none">${lineChart({ n: pts.length, series: [{ pts: pts.map((y, i) => ({ i, y })), color: 'var(--spruce)', endDot: true }], h: 40, w: 96, pad: { l: 2, r: 6, t: 6, b: 6 }, yFmt: () => '' }).replace(/<text[^>]*>[^<]*<\/text>/g, '').replace(/<line class="grid"[^>]*\/>/g, '')}</span></button>`;
  }).filter(Boolean);
  const weeks = [3, 2, 1, 0].map(i => addDays(weekStart(todayKey()), -7 * i));
  const gs = weeks.map(ws => groupSets(ws, addDays(ws, 6)));
  const prs = [];
  for (const w of S.workouts.filter(w => w.kind === 'strength' && w.date > addDays(todayKey(), -28))) for (const e of w.ex || []) {
    const ex = exById(e.ex); if (!ex || ex.kind !== 'load') continue;
    const before = exHistory(e.ex).filter(h => h.date < w.date);
    if (before.length && bestE1(e.sets) > Math.max(...before.map(h => bestE1(h.sets))) + 0.01) prs.push({ d: w.date, t: `${ex.name}: ${setsLine(e.sets, ex)}` });
  }
  return `${lifts.length ? `<div class="section"><div class="sh"><h2 class="h2">Main lifts</h2></div><div class="group divided">${lifts.join('')}</div><p class="inset-note">Heaviest set each session. Tap one for its history.</p></div>` : `<div class="group">${emptyState('dumbbell', 'Your lifts appear here', 'After a few sessions you’ll see each main lift moving up.')}</div>`}
    <div class="section"><div class="sh"><h2 class="h2">Sets by muscle group</h2></div><div class="group pad stack">
      ${Object.keys(GROUPS).map(g => `<div class="stack-s"><div class="row between"><span class="small">${GROUPS[g].label}</span><span class="cap ter">target ${GROUPS[g].target} a week</span></div>${barChart({ vals: gs.map(x => Math.round(x[g] || 0)), color: 'var(--spruce)', target: GROUPS[g].target, h: 70, xLabels: weeks.map((ws, i) => ({ i, label: i === 3 ? 'This week' : fmtDate(ws) })), yFmt: v => v, yMax: Math.max(GROUPS[g].target * 1.6, ...gs.map(x => x[g] || 0)) })}</div>`).join('')}
    </div></div>
    ${prs.length ? `<div class="section"><div class="sh"><h2 class="h2">Stronger this month</h2></div><div class="group divided">${prs.slice(-6).reverse().map(p => item({ t: esc(p.t), s: fmtDay(p.d) })).join('')}</div></div>` : ''}`;
}

/* ---------- evidence ---------- */
function evidenceText(e) {

function evidenceItem(e0) {

    const symNow = SYMPTOMS.filter(s => r.sym[s.id] || r.symPrev[s.id]).map(s => `<div class="item"><span class="grow t">${s.label}</span><span class="v num">${r.sym[s.id]} ${plural(r.sym[s.id], 'day')}</span><span class="v num ter" style="min-width:84px">${r.symPrev[s.id]} before</span></div>`).join('');
    const opts = FOCUS_OPTIONS.filter(o => o.when(r)).slice(0, 4);
    const fKey = isCurrent ? ws : nextWs;
    const wChange = (() => { const ser = weightSeries(); const at = k => { const p = ser.filter(x => x.d <= k).pop(); return p ? p.avg : null; }; const a = at(addDays(ws, -1)), b = at(addDays(ws, 6)); return a && b ? b - a : null; })();
    return `${r.wins.length ? `<div class="group pad stack-s"><p class="small semi">Went well</p>${r.wins.map(w => `<p class="row" style="gap:10px;align-items:flex-start">${icon('check', 'sm acc')}<span>${esc(w)}</span></p>`).join('')}</div>` : ''}

        ${r.wk.logged ? `<div class="item"><span class="grow t">Energy, daily average</span><span class="v num">${fmtInt(r.wk.avg)} kcal</span></div>` : ''}

        <div class="group">${opts.map(o => `<button class="item" data-a="setFocus" data-ws="${fKey}" data-t="${esc(o.text)}"><span class="grow t">${esc(o.text)}</span>${S.focus[fKey] === o.text ? icon('check', 'sm acc') : ''}</button>`).join('')}</div></div>`;

};

function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] = a[k] || {}), o); t[last] = v; }
function fieldNum(path, label, unit, hint, step) { const v = getPath(S, path); return `<div class="field"><label for="f-${path}">${label}</label><div class="row"><input id="f-${path}" inputmode="decimal" value="${v == null ? '' : v}" data-in="pNum" data-path="${path}" ${step ? `data-step="${step}"` : ''}>${unit ? `<span class="small sec" style="min-width:30px">${unit}</span>` : ''}</div>${hint ? `<p class="hint">${hint}</p>` : ''}</div>`; }
function fieldText(path, label, ph, hint, area) { const v = getPath(S, path) || ''; return `<div class="field"><label for="f-${path}">${label}</label>${area ? `<textarea id="f-${path}" rows="3" data-in="pText" data-path="${path}" placeholder="${esc(ph || '')}">${esc(v)}</textarea>` : `<input id="f-${path}" value="${esc(v)}" data-in="pText" data-path="${path}" placeholder="${esc(ph || '')}">`}${hint ? `<p class="hint">${hint}</p>` : ''}</div>`; }
function fieldTime(path, label) { const v = getPath(S, path) || ''; return `<div class="item"><label class="grow t" for="f-${path}">${label}</label><input type="time" id="f-${path}" value="${esc(v)}" data-ch="pText" data-path="${path}" style="width:auto;min-height:38px;padding:6px 10px"></div>`; }
function choice(path, opts, multi) { const v = getPath(S, path); return `<div class="chips">${opts.map(([id, l]) => chip(l, multi ? (v || []).includes(id) : v === id, 'pChoice', `data-path="${path}" data-v="${esc(String(id))}" ${multi ? 'data-multi="1"' : ''} ${typeof id === 'number' ? 'data-num="1"' : ''}`)).join('')}</div>`; }
const YNU = [['yes', 'Yes'], ['no', 'No'], ['unsure', 'Not sure']];
A.pNum = (d, el) => { const v = num(el.value); setPath(S, d.path, v); save(); if (/^profile\.(weightKg|heightCm|age|activity|goalHigh)/.test(d.path)) retarget(); };
A.pText = (d, el) => { setPath(S, d.path, el.value); save(); };
A.pChoice = d => {
  let v = d.v; const cur = getPath(S, d.path);
  if (d.num) v = +v;
  if (d.multi) { const arr = (cur || []).slice(); const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); setPath(S, d.path, arr); }
  else setPath(S, d.path, v);
  if (d.path === 'profile.activity') retarget();
  UI.preview = null; save(); refreshSheet(); refresh();
};
function retarget() {
  const lw = latestWeight(), nt = estimateTargets(S.profile, lw ? lw.kg : S.profile.weightKg);
  S.targets.protein = nt.protein; S.targets.water = nt.water; S.targets.maintenance = nt.maintenance;
  if (S.targets.source !== 'data' && !S.targets.custom) { S.targets.kcal = nt.kcal; S.targets.satfat = nt.satfat; }
  save();
}

  return `<div class="ob-body" style="justify-content:center">
      <div class="stack-l"><span class="wordmark">Steady</span><p class="coach" style="font-size:21px;max-width:26ch">A calm daily guide to what to eat, how to train and how to recover, built around you.</p></div>
      <div class="stack-s small sec" style="max-width:36ch"><p>Meals planned around foods you like, with nothing to make up for.</p><p>Strength training that adapts to what you actually did and how you slept.</p><p>Private: everything stays on this phone, encrypted with your passcode.</p></div>
    </div>
    <div class="stack"><button class="btn block" data-a="suNext">Get started</button><button class="btn text block" data-a="suDemo">Look around with sample data first</button></div>`;
}
A.suDemo = () => { loadDemo(); applyTheme(); render(); };

function suCode() {
  return `<div class="ob-body"><div class="stack"><h1 class="title">Your setup code</h1><p class="lead">Four words, given to you with the link. They unlock the details that were prepared for you. You only need them once.</p></div>
      <div class="field"><label for="su-code">Setup code</label><input id="su-code" value="${esc(SU.code)}" data-in="suCode" data-enter="suUnlock" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="four words, with spaces" style="font-size:19px"></div>
      ${SU.err ? `<p class="small" style="color:var(--brick)">${esc(SU.err)}</p>` : ''}
      ${SU.busy ? `<div class="row"><span class="spinner"></span><span class="small sec">Unlocking…</span></div>` : ''}
      <button class="btn text" data-a="suNoCode" style="align-self:flex-start;padding:0">I don’t have a code</button></div>
    <div class="ob-foot"><button class="btn quiet" data-a="suBack">Back</button><button class="btn" data-a="suUnlock" ${SU.busy ? 'disabled' : ''}>Unlock</button></div>`;
}
A.suCode = (d, el) => { SU.code = el.value; };
A.suUnlock = async () => {
  SU.code = (($('#su-code') || {}).value || SU.code).trim();
  if (SU.code.split(/\s+/).length < 4) { SU.err = 'The code is four words, separated by spaces.'; render(); return; }
  SU.busy = true; SU.err = ''; render();
  try {
    SU.data = await decryptSetup(SU.code);
    S = freshState(); applyPreset(S, SU.data);
    SU.busy = false; SU.step = 'confirm'; render();
  } catch (e) { SU.busy = false; SU.err = 'That code doesn’t match. Check the spelling of each word.'; render(); }
};
A.suNoCode = () => { SU.data = null; SU.step = 'about'; render(); };

function suConfirm() {
  const p = S.profile, m = S.medical, T = estimateTargets(p, p.weightKg);
  const sym = SYMPTOMS.filter(s => (p.menopause.symptoms || []).includes(s.id)).map(s => s.label.toLowerCase());
  return `<div class="ob-body"><div class="stack"><h1 class="title">Is this right?</h1><p class="lead">What Steady knows about you so far. You can change any of it later in Profile.</p></div>
      <div class="group divided">
        ${item({ t: 'Age', v: p.age ? p.age : '–' })}${item({ t: 'Height', v: p.heightCm ? p.heightCm + ' cm' : '–' })}
        <div class="item"><span class="grow t">Weight now</span>${stepper('su-w', fmtKg(p.weightKg), 0.1, 'kg', 'stepNum', 'data-in="suW"').replace('class="stepper"', 'class="stepper" style="max-width:220px"')}</div>
        ${item({ t: 'Usually', v: p.usualLow ? `${fmtKg(p.usualLow, 0)} to ${fmtKg(p.usualHigh, 0)} kg` : '–' })}
        ${item({ t: 'Goal range', v: p.goalLow ? `${fmtKg(p.goalLow, 0)} to ${fmtKg(p.goalHigh, 0)} kg` : '–' })}
        ${item({ t: 'Training', v: p.where === 'both' ? 'Gym and home' : p.where === 'home' ? 'Home' : 'Gym' })}
        ${sym.length ? item({ t: 'Menopause symptoms', s: cap(listJoin(sym)) }) : ''}
        ${m.history ? item({ t: 'Health notes', s: esc([m.history, m.hrt ? 'HRT: ' + lc(m.hrt) : ''].filter(Boolean).join('. ')) + '. Saved privately on this phone, and used to keep the plan safe.' }) : ''}
      </div>
      <div class="group pad stack-s"><p class="small semi">Your starting targets</p><p class="small sec">${fmtInt(T.kcal)} kcal, ${T.protein} g protein, ${fmtInt(T.calcium)} mg calcium and ${T.fibre} g fibre a day; three strength sessions and 150 active minutes a week. They adjust as Steady learns from your weigh-ins and meals.</p></div>
    </div>
    <div class="ob-foot"><button class="btn quiet" data-a="suBack">Back</button><button class="btn" data-a="suNext">Looks right</button></div>`;
}
A.suW = (d, el) => { const v = num(el.value); if (v && v > 30 && v < 200) { S.profile.weightKg = v; S.targets = estimateTargets(S.profile, v); } };

function suAbout() {
  const p = S.profile;
  const f = (k, label, unit) => `<div class="field"><label for="su-${k}">${label}</label><div class="row"><input id="su-${k}" inputmode="decimal" value="${p[k] == null ? '' : p[k]}" data-in="suAboutSet" data-k="${k}"><span class="small sec" style="min-width:24px">${unit}</span></div></div>`;
  return `<div class="ob-body"><div class="stack"><h1 class="title">About you</h1><p class="lead">So the plan fits you. Nothing leaves this phone.</p></div>
      <div class="row">${f('age', 'Age', '')}${f('heightCm', 'Height', 'cm')}</div>${f('weightKg', 'Weight now', 'kg')}
      <div class="row">${f('goalLow', 'Goal range, from', 'kg')}${f('goalHigh', 'to', 'kg')}</div>
      <div class="field"><span class="lbl">Day to day, outside workouts</span><div class="chips">${[['light', 'Mostly sitting'], ['moderate', 'On my feet a fair bit'], ['active', 'Very active']].map(([id, l]) => chip(l, p.activity === id, 'suAct', `data-v="${id}"`)).join('')}</div></div>
      <div class="field"><span class="lbl">Menopause symptoms you usually have</span><div class="chips">${SYMPTOMS.map(s => chip(s.label, (p.menopause.symptoms || []).includes(s.id), 'suSym', `data-v="${s.id}"`)).join('')}</div></div>
      ${SU.err ? `<p class="small" style="color:var(--brick)">${esc(SU.err)}</p>` : ''}</div>
    <div class="ob-foot"><button class="btn quiet" data-a="suBack">Back</button><button class="btn" data-a="suAboutDone">Continue</button></div>`;
}
A.suAboutSet = (d, el) => { S.profile[d.k] = num(el.value); };
A.suAct = d => { S.profile.activity = d.v; render(); };
A.suSym = d => { const a = S.profile.menopause.symptoms; const i = a.indexOf(d.v); if (i >= 0) a.splice(i, 1); else a.push(d.v); render(); };
A.suAboutDone = () => {
  const p = S.profile;
  if (!(p.age > 17 && p.age < 100) || !(p.heightCm > 120 && p.heightCm < 220) || !(p.weightKg > 30 && p.weightKg < 250)) { SU.err = 'Add your age, height and weight to continue.'; render(); return; }
  if (!p.goalLow || !p.goalHigh) { p.goalLow = p.goalHigh = p.weightKg; }
  S.targets = estimateTargets(p, p.weightKg); suNext();
};

function suName() {
  return `<div class="ob-body"><div class="stack"><h1 class="title">What should Steady call you?</h1><p class="lead">Used in the morning greeting. Optional.</p></div>
      <div class="field"><label for="su-name">First name</label><input id="su-name" value="${esc(S.profile.name || '')}" data-in="suName" data-enter="suNext" autocomplete="given-name" style="font-size:19px"></div></div>
    <div class="ob-foot"><button class="btn quiet" data-a="suBack">Back</button><button class="btn" data-a="suNext">Continue</button></div>`;
}
A.suName = (d, el) => { S.profile.name = el.value.trim().slice(0, 30); };

function suLock() {
  if (SU.kind === 'phrase') return `<div class="ob-body"><div class="stack"><h1 class="title">Choose a passphrase</h1><p class="lead">It encrypts everything Steady keeps on this phone. There’s no way to recover it, so pick something you’ll remember.</p></div>
      <div class="field"><label for="su-p1">Passphrase</label><input id="su-p1" type="password" autocomplete="new-password" data-in="suP1" value="${esc(SU.phrase)}"><p class="hint">At least 8 characters. Four ordinary words works well.</p></div>
      <div class="field"><label for="su-p2">Again</label><input id="su-p2" type="password" autocomplete="new-password" data-in="suP2" value="${esc(SU.phrase2)}"></div>
      ${SU.err ? `<p class="small" style="color:var(--brick)">${esc(SU.err)}</p>` : ''}
      <button class="btn text" data-a="suKind" style="align-self:flex-start;padding:0">Use a 6-digit passcode instead</button></div>
    <div class="ob-foot"><button class="btn quiet" data-a="suSkipLock">Skip</button><button class="btn" data-a="suPhraseDone" ${SU.busy ? 'disabled' : ''}>Finish</button></div>`;
  const cur = SU.stage === 1 ? SU.pin : SU.pin2;
  return `<div class="ob-body" style="align-items:center;text-align:center"><div class="stack" style="align-items:center"><h1 class="title">Choose a passcode</h1><p class="lead" style="max-width:32ch">${SU.err ? `<span style="color:var(--brick)">${esc(SU.err)}</span>` : SU.busy ? 'Encrypting…' : SU.stage === 1 ? 'Six digits. It locks Steady and encrypts everything it keeps on this phone.' : 'Once more, to check.'}</p></div>
      ${pinDots(cur.length)}${keypadHTML('suKey')}
      <button class="btn text" data-a="suKind">Use a longer passphrase instead</button></div>
    <div class="ob-foot"><button class="btn quiet" data-a="suBack">Back</button><button class="btn text" data-a="suSkipLock">Skip for now</button></div>`;
}
A.suKind = () => { SU.kind = SU.kind === 'pin' ? 'phrase' : 'pin'; SU.pin = SU.pin2 = SU.phrase = SU.phrase2 = ''; SU.stage = 1; SU.err = ''; render(); };
A.suP1 = (d, el) => { SU.phrase = el.value; }; A.suP2 = (d, el) => { SU.phrase2 = el.value; };
A.suKey = d => {
  if (SU.busy) return;
  SU.err = '';
  const k = SU.stage === 1 ? 'pin' : 'pin2';
  if (d.v === 'del') SU[k] = SU[k].slice(0, -1); else if (/^\d$/.test(d.v) && SU[k].length < 6) SU[k] += d.v;
  if (SU.stage === 1 && SU.pin.length === 6) SU.stage = 2;
  else if (SU.stage === 2 && SU.pin2.length === 6) { if (SU.pin === SU.pin2) { finishSetup(SU.pin, 'pin'); return; } SU.err = 'Those didn’t match. Try again.'; SU.pin = SU.pin2 = ''; SU.stage = 1; }
  render();
};
A.suPhraseDone = () => { if (SU.phrase.length < 8) { SU.err = 'Use at least 8 characters.'; render(); return; } if (SU.phrase !== SU.phrase2) { SU.err = 'Those don’t match.'; render(); return; } finishSetup(SU.phrase, 'phrase'); };
A.suSkipLock = async () => { if (!(await ask({ title: 'Continue without a passcode?', text: 'Anyone who opens Steady on this phone could see your diary and health details. You can add a passcode later in Profile.', ok: 'Continue', cancel: 'Go back' }))) return; finishSetup(null); };
async function finishSetup(code, kind) {
  SU.busy = true; render();
  S.onboarded = true; S.demo = false; S.created = todayKey();
  S.targets = Object.assign(S.targets || {}, estimateTargets(S.profile, S.profile.weightKg));
  if (S.profile.weightKg && !Object.keys(S.weights).length) S.weights[todayKey()] = S.profile.weightKg;
  const t = todayKey();
  generatePlan(t, 7 - dow(t));
  if (dow(t) >= 4) generatePlan(addDays(weekStart(t), 7), 7);
  try {
    if (code && cryptoAvailable()) { S.settings.lock.kind = kind; await setPasscode(code); }
    else await saveNow();
  } catch (e) { console.warn(e); await saveNow(); }
  SU.busy = false; SU.pin = SU.pin2 = SU.phrase = SU.phrase2 = ''; SU.code = '';
  UI.tab = 'today'; render();
  toast('Your week is planned. Start with the morning check-in.');
}

/* ---------- lock screen ---------- */
const LK = { code: '', msg: '', shake: false, busy: false };
function lockKind() { try { return JSON.parse(readRaw()).kind || 'pin'; } catch (e) { return 'pin'; } }
function renderLock() {
  const wait = LOCK.waitUntil > Date.now() ? Math.ceil((LOCK.waitUntil - Date.now()) / 1000) : 0;
  const msg = wait ? `Too many tries. Wait ${wait} seconds.` : LK.busy ? 'Unlocking…' : LK.msg || (lockKind() === 'phrase' ? 'Enter your passphrase' : 'Enter your passcode');
  if (wait) setTimeout(() => { if (LOCK.locked) render(); }, 1000);
  if (lockKind() === 'phrase') return `<div class="lock"><span class="wordmark">Steady</span><p class="sec">${esc(msg)}</p>
    <div class="stack" style="width:100%;max-width:320px"><input id="lock-pass" type="password" autocomplete="current-password" data-enter="lockPhrase" ${wait || LK.busy ? 'disabled' : ''} aria-label="Passphrase"><button class="btn block" data-a="lockPhrase" ${wait || LK.busy ? 'disabled' : ''}>Unlock</button></div>
    <button class="btn text" data-a="lockForgot">Forgotten it?</button></div>`;
  return `<div class="lock"><span class="wordmark">Steady</span><p class="sec" role="status">${esc(msg)}</p>
    <div class="pin-dots ${LK.shake ? 'shake' : ''}">${Array.from({ length: 6 }, (_, i) => `<i class="${i < LK.code.length ? 'on' : ''}"></i>`).join('')}</div>
    ${keypadHTML('lockKey')}<button class="btn text" data-a="lockForgot">Forgotten it?</button></div>`;
}
async function tryUnlock(code) {
  if (LOCK.waitUntil > Date.now()) return;
  LK.busy = true; render();
  try {
    await unlockWith(code);
    LK.code = ''; LK.msg = ''; LK.busy = false;
    await postLoad(); applyTheme(); render();
  } catch (e) {
    LK.busy = false; LK.code = ''; LOCK.fails++;
    if (LOCK.fails >= 5) LOCK.waitUntil = Date.now() + 30000 * Math.pow(2, Math.min(4, LOCK.fails - 5));
    LK.msg = 'That isn’t right. Try again.'; LK.shake = true; render();
    setTimeout(() => { LK.shake = false; }, 450);
  }
}
A.lockKey = d => {
  if (LK.busy || LOCK.waitUntil > Date.now()) return;
  if (d.v === 'del') LK.code = LK.code.slice(0, -1); else if (/^\d$/.test(d.v) && LK.code.length < 6) LK.code += d.v;
  if (LK.code.length === 6) { tryUnlock(LK.code); return; }
  render();
};
A.lockPhrase = () => { const v = ($('#lock-pass') || {}).value || ''; if (v) tryUnlock(v); };
A.lockForgot = () => openSheet({ title: 'Forgotten your passcode?', body: () => `<p class="lead measure">Your data is encrypted with it, so it can’t be recovered without it, not even by whoever set Steady up. That’s what keeps it private.</p>
    <p class="small sec">If you saved a backup, you can erase Steady and restore it afterwards, using the passcode that was set when the backup was made.</p>`,
  foot: () => `<button class="btn danger" data-a="lockErase">Erase and start again</button>` });
A.lockErase = async () => { if (!(await ask({ title: 'Erase everything on this phone?', text: 'This can’t be undone.', ok: 'Erase', danger: true }))) return; eraseAll(); };
document.addEventListener('keydown', e => {
  if (!/^\d$/.test(e.key) && e.key !== 'Backspace') return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const v = e.key === 'Backspace' ? 'del' : e.key;
  if (LOCK.locked && lockKind() === 'pin') A.lockKey({ v });
  else if (S && !S.onboarded && SU.step === 'lock' && SU.kind === 'pin') A.suKey({ v });
  else if (topSheet() && topSheet().key === 'pinset') A.psKey({ v });
});

/* ---------- start-up ---------- */

/* 'auto' leaves the theme to the system, or to the host page when Steady runs inside one */
const HOST_THEME = document.documentElement.getAttribute('data-theme');
function applyTheme() {
  const t = S ? S.settings.theme : 'auto';
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else if (HOST_THEME) document.documentElement.setAttribute('data-theme', HOST_THEME);
  else document.documentElement.removeAttribute('data-theme');
}
function ensurePlan() {
  if (!S || !S.onboarded) return;
  const t = todayKey(), ws = weekStart(t);
  const missing = weekDays(ws).filter(d => d >= t && !(S.plan[d] && S.plan[d].meals.length));
  if (missing.length) generatePlan(missing[0], daysBetween(missing[0], addDays(ws, 6)) + 1);
}
async function syncNow(quiet) {
  try {
    const r = await ghSync();
    if (r.needAuth) { if (!quiet) toast('Fitbit access has expired. Tap Sign in and sync in Profile, Fitbit.'); }
    else if (!quiet) { const bad = Object.entries(r.status || {}).filter(([, v]) => v !== 'ok').map(([k]) => (GH_METRICS.find(m => m.id === k) || {}).label).filter(Boolean); toast(bad.length ? `Synced. Not available: ${listJoin(bad.map(x => x.toLowerCase()))}.` : 'Fitbit synced'); }
  } catch (e) { if (!quiet) toast('Fitbit sync didn’t work just now. Try again later.'); }
  UI.preview = null; refresh(); refreshSheet();
}
async function postLoad() {
  const gh = ghApplyPending();
  if (S.onboarded) { settleIgnored(); ensurePlan(); }
  if (gh === 'ok') { setTimeout(() => toast('Fitbit connected. Syncing…'), 300); syncNow(); }
  else if (gh === 'error') setTimeout(() => toast(S.health.error || 'Fitbit didn’t connect'), 300);
  else if (S.health.connected && !S.health.sample && ghTokenValid() && (!S.health.lastSync || Date.now() - new Date(S.health.lastSync) > 2 * 3600e3)) syncNow(true);
}

/* auto-lock when the app has been in the background */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { LOCK.hiddenAt = Date.now(); if (S) saveNow(); return; }
  if (S && S.settings.lock.on && CRYPTO_KEY && LOCK.hiddenAt && Date.now() - LOCK.hiddenAt >= (S.settings.lock.autoMin || 0) * 60000) {
    closeAllSheets(true); stopRest(); lockNow(); LK.code = ''; LK.msg = ''; render(); return;
  }
  if (S && S.onboarded && !LOCK.locked) { ensurePlan(); refresh(); }
});
window.addEventListener('pagehide', () => { if (S) saveNow(); });

async function boot() {
  ghCatchRedirect();
  let st = loadState();
  if (st === 'new' && BOOT_DEMO) { loadDemo(); st = 'ready'; }
  if (st === 'ready') await postLoad();
  applyTheme();
  render();
  const tryAI = () => aiInit().then(() => { if (UI.sheets.length) refreshSheet(); });
  tryAI(); if (!window.claude) { setTimeout(() => { if (!AI.sample) tryAI(); }, 1500); setTimeout(() => { if (!AI.sample) tryAI(); }, 5000); }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !inFrame() && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
