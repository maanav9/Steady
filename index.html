/* Steady v2. Calm, Apple-grade restraint: system UI type, Newsreader for the voice, hairline groups instead
   of cards, one deep spruce accent. The one bold element is Today's day line. */
:root {
  --canvas: #F2F3F0; --surface: #FFFFFF; --raised: #F7F8F6; --fill: #E9EBE7; --fill-2: #DFE2DD;
  --ink: #1A1F1D; --ink-2: #5C6460; --ink-3: #8E9591; --line: #E2E5E1; --line-strong: #CDD2CD;
  --spruce: #245B4E; --spruce-ink: #FFFFFF; --spruce-tint: #E3ECE8; --spruce-soft: #9DBFB3;
  --ochre: #B5852A; --iris: #5B63A6; --lake: #3C7BA0; --brick: #B0533E; --bone: #9A8768; --moss: #6C8C43;
  --iris-tint: #E8E9F3; --lake-tint: #E1EBF1; --brick-tint: #F4E5E0; --ochre-tint: #F4ECDC;
  --track: #E6E8E4; --scrim: rgba(18, 24, 22, .32); --tabbar: rgba(242, 243, 240, .84);
  --serif: 'Newsreader', 'New York', 'Iowan Old Style', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r-group: 18px; --r-ctl: 13px; --gutter: 20px; --tab-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0D0F10; --surface: #171A1B; --raised: #1D2122; --fill: #23282A; --fill-2: #2C3234;
  --ink: #ECEFEC; --ink-2: #A3ABA7; --ink-3: #737B77; --line: #262B2C; --line-strong: #353B3C;
  --spruce: #7DC1AB; --spruce-ink: #0D1513; --spruce-tint: #15302A; --spruce-soft: #3E6B5F;
  --ochre: #D6A54C; --iris: #9AA1DE; --lake: #79B2D2; --brick: #E08A73; --bone: #C2AF8E; --moss: #A3C273;
  --iris-tint: #23253A; --lake-tint: #192B36; --brick-tint: #33211C; --ochre-tint: #30271A;
  --track: #252A2B; --scrim: rgba(0, 0, 0, .5); --tabbar: rgba(13, 15, 16, .84); color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #0D0F10; --surface: #171A1B; --raised: #1D2122; --fill: #23282A; --fill-2: #2C3234;
  --ink: #ECEFEC; --ink-2: #A3ABA7; --ink-3: #737B77; --line: #262B2C; --line-strong: #353B3C;
  --spruce: #7DC1AB; --spruce-ink: #0D1513; --spruce-tint: #15302A; --spruce-soft: #3E6B5F;
  --ochre: #D6A54C; --iris: #9AA1DE; --lake: #79B2D2; --brick: #E08A73; --bone: #C2AF8E; --moss: #A3C273;
  --iris-tint: #23253A; --lake-tint: #192B36; --brick-tint: #33211C; --ochre-tint: #30271A;
  --track: #252A2B; --scrim: rgba(0, 0, 0, .5); --tabbar: rgba(13, 15, 16, .84); color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 17px/1.42 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overscroll-behavior-y: none; letter-spacing: -0.005em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
input, textarea, select { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 12px 14px; width: 100%; min-height: 48px; outline: none; }
textarea { resize: vertical; line-height: 1.4; }
input:focus, textarea:focus, select:focus { border-color: var(--spruce); box-shadow: 0 0 0 3px var(--spruce-tint); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--spruce); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; font-weight: inherit; }
a { color: var(--spruce); }
.i { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; } .i.xs { width: 15px; height: 15px; stroke-width: 1.8; } .i.lg { width: 26px; height: 26px; }
.i.filled { fill: currentColor; }

/* ---- type ---- */
.serif { font-family: var(--serif); font-optical-sizing: auto; font-weight: 400; letter-spacing: -0.012em; }
.title { font-family: var(--serif); font-size: 34px; line-height: 1.08; font-weight: 400; letter-spacing: -0.02em; }
.h2 { font-family: var(--serif); font-size: 22px; line-height: 1.2; font-weight: 400; }
.h3 { font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
.coach { font-family: var(--serif); font-size: 19px; line-height: 1.42; color: var(--ink-2); font-weight: 400; max-width: 34ch; text-wrap: pretty; }
.sec { color: var(--ink-2); } .ter { color: var(--ink-3); }
.small { font-size: 15px; line-height: 1.4; } .cap { font-size: 13px; line-height: 1.35; }
.num { font-variant-numeric: tabular-nums; }
.semi { font-weight: 600; } .acc { color: var(--spruce); }
.lead { font-size: 17px; color: var(--ink-2); line-height: 1.5; }
.measure { max-width: 60ch; }

/* ---- shell ---- */
#app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.screen { padding: 8px var(--gutter) calc(var(--tab-h) + 44px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 28px; }
.screen.bare { padding-bottom: 120px; }
.hdr { display: flex; align-items: flex-start; gap: 10px; padding-top: 10px; }
.hdr .grow { min-width: 0; }
.hdr .eyebrow { font-size: 15px; color: var(--ink-3); font-weight: 500; margin-bottom: 4px; }
.hdr-actions { display: flex; gap: 8px; margin-left: auto; padding-top: 2px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn.solid { background: var(--fill); color: var(--ink); }
.icon-btn.acc { background: var(--spruce); color: var(--spruce-ink); }
.icon-btn:active { opacity: .7; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--fill); color: var(--ink); display: grid; place-items: center; font-family: var(--serif); font-size: 19px; flex: none; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.stack-l { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.top { align-items: flex-start; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; }
.sample-note { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--ink-2); padding: 10px 14px; border-radius: var(--r-ctl); background: var(--fill); }
.sample-note button { margin-left: auto; color: var(--spruce); font-weight: 600; white-space: nowrap; }

/* ---- sections and groups ---- */
.section { display: flex; flex-direction: column; gap: 10px; }
.sh { display: flex; align-items: baseline; gap: 12px; padding: 0 2px; }
.sh .h2 { flex: 1; }
.sh .link { font-size: 15px; font-weight: 600; color: var(--spruce); white-space: nowrap; }
.link { color: var(--spruce); font-weight: 600; }
.group { background: var(--surface); border-radius: var(--r-group); overflow: hidden; }
.group.pad { padding: 16px 18px; }
.group.pad-l { padding: 20px 20px; }
.group > .item + .item, .group > .item + .sub, .divided > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; min-height: 56px; width: 100%; text-align: left; }
.item.tall { padding: 16px 18px; }
.item .t { font-weight: 500; line-height: 1.3; }
.item .s { font-size: 15px; color: var(--ink-2); margin-top: 2px; line-height: 1.35; }
.item .v { color: var(--ink-2); font-size: 15px; text-align: right; flex: none; max-width: 48%; }
.item .chev { color: var(--ink-3); width: 18px; height: 18px; }
button.item:active, .tappable:active { background: var(--raised); }
.inset-note { font-size: 13px; color: var(--ink-3); padding: 0 18px; line-height: 1.4; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: baseline; }
.kv .k { color: var(--ink-2); }
.kv .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

/* ---- buttons, chips, controls ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 14px; background: var(--spruce); color: var(--spruce-ink); font-weight: 600; font-size: 17px; white-space: nowrap; transition: opacity .15s; }
.btn:active { opacity: .82; }
.btn.tint { background: var(--spruce-tint); color: var(--spruce); }
.btn.quiet { background: var(--fill); color: var(--ink); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.text { background: none; color: var(--spruce); padding: 0 6px; min-height: 40px; }
.btn.danger { background: var(--brick-tint); color: var(--brick); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 15px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btns { display: flex; gap: 10px; }
.btns > .btn { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 7px 14px; border-radius: 19px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--spruce-tint); box-shadow: none; color: var(--spruce); }
.chip.no[aria-pressed="true"] { background: var(--brick-tint); color: var(--brick); }
.chip.less[aria-pressed="true"] { background: var(--fill); color: var(--ink-2); }
.chip[disabled] { opacity: .4; }
.chip .dots { display: inline-flex; gap: 3px; margin-left: 2px; }
.chip .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .25; display: block; }
.chip .dots i.on { opacity: 1; }
.seg { display: flex; background: var(--fill); border-radius: 11px; padding: 2px; gap: 2px; }
.seg button { flex: 1; min-height: 34px; border-radius: 9px; font-weight: 500; font-size: 15px; color: var(--ink); padding: 0 8px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 .5px rgba(0, 0, 0, .04); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--fill-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--fill-2); } }
.scroll-x { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 2px var(--gutter); }
.scroll-x::-webkit-scrollbar { display: none; }
.scroll-x > * { flex: none; }
.toggle { position: relative; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); flex: none; transition: background .2s; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .18); transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--spruce); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper > button { width: 44px; height: 44px; border-radius: 12px; background: var(--fill); display: grid; place-items: center; flex: none; }
.stepper input { text-align: center; font-weight: 600; font-size: 20px; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
.stepper .unit { color: var(--ink-2); font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 15px; }
.field .hint { font-size: 13px; color: var(--ink-3); line-height: 1.4; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale.three { grid-template-columns: repeat(3, 1fr); }
.scale button { min-height: 44px; border-radius: 11px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); font-weight: 500; font-size: 14px; padding: 4px 2px; }
.scale button[aria-pressed="true"] { background: var(--ink); color: var(--canvas); box-shadow: none; }

/* ---- Today: fuel ---- */
.fuel { display: flex; flex-direction: column; gap: 14px; }
.meter { display: flex; flex-direction: column; gap: 7px; }
.meter .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.meter .lbl .name { font-weight: 500; }
.meter .lbl .val { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter .lbl .val b { color: var(--ink); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--track); position: relative; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; display: block; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar > i.plan { opacity: .28; }
.bar.thin { height: 4px; }
.fuel-foot { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-2); padding-top: 2px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 12px; }
.fuel-foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--spruce); flex: none; }
.fuel-foot .dot.calm { background: var(--ochre); } .fuel-foot .dot.care { background: var(--brick); }

/* ---- Today: the day line ---- */
.dayline { position: relative; padding: 6px 0; }
.dl { display: grid; grid-template-columns: 54px 18px 1fr auto; column-gap: 12px; align-items: start; padding: 10px 16px 10px 14px; position: relative; }
.dl::before { content: ''; position: absolute; left: calc(14px + 54px + 12px + 8.5px); top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
.dl:first-child::before { top: 22px; } .dl:last-child::before { bottom: calc(100% - 22px); }
.dl .time { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: 4px; text-align: right; }
.dl .node { width: 11px; height: 11px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--ink-3); margin: 6px auto 0; position: relative; z-index: 1; }
.dl.done .node { background: var(--spruce); box-shadow: none; }
.dl.next .node { box-shadow: inset 0 0 0 2px var(--spruce), 0 0 0 4px var(--spruce-tint); }
.dl.move .node { border-radius: 3px; }
.dl .body { min-width: 0; text-align: left; }
.dl .kind { font-size: 13px; color: var(--ink-3); font-weight: 500; display: flex; gap: 8px; align-items: center; }
.dl .kind .next-tag { color: var(--spruce); font-weight: 600; }
.dl .name { font-weight: 600; line-height: 1.3; margin-top: 1px; letter-spacing: -0.01em; }
.dl.done .name { color: var(--ink-2); font-weight: 500; }
.dl .meta { font-size: 15px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.dl .spec { margin-top: 8px; max-width: 168px; }
.dl .act { padding-top: 2px; }
.tick { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; color: transparent; transition: background .2s, box-shadow .2s; }
.tick[aria-pressed="true"] { background: var(--spruce); box-shadow: none; color: var(--spruce-ink); }
.tick[aria-pressed="true"] .i { animation: pop .28s ease-out; }
@keyframes pop { from { transform: scale(.5); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.dl-add { display: flex; gap: 10px; padding: 10px 16px 14px calc(14px + 54px + 12px + 18px + 12px); }
.dl-add .btn { flex: 0 0 auto; }

/* ---- spectrum ---- */
.spec { display: flex; gap: 2px; height: 4px; border-radius: 2px; overflow: hidden; width: 100%; }
.spec i { display: block; height: 100%; border-radius: 1px; min-width: 3px; }
.spec.lg { height: 10px; border-radius: 4px; gap: 3px; }
.spec.lg i { border-radius: 2px; }
.spec-empty { background: var(--track); }
.spec-legend { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.spec-legend li { display: inline-flex; align-items: center; gap: 6px; }
.spec-legend i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.photo { border-radius: 14px; overflow: hidden; background: var(--fill); }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo.thumb { width: 56px; height: 56px; border-radius: 10px; flex: none; }
.photo.hero { width: 100%; aspect-ratio: 4 / 3; }

/* ---- Today: movement and recovery ---- */
.move-card { display: flex; flex-direction: column; gap: 14px; }
.why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.why li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; font-size: 15px; color: var(--ink-2); line-height: 1.4; }
.why li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); margin-top: 8px; justify-self: center; }
.ready { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.ready .dot { width: 8px; height: 8px; border-radius: 50%; }
.ready.good .dot { background: var(--spruce); } .ready.steady .dot { background: var(--ochre); } .ready.low .dot { background: var(--brick); }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.mini-stats > * { padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; min-width: 0; text-align: left; }
.mini-stats > * + * { border-left: 1px solid var(--line); }
.mini-stats .k { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.mini-stats .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.mini-stats .v small { font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.water-add { display: flex; gap: 6px; margin-top: 6px; }
.water-add button { flex: 1; min-height: 32px; border-radius: 9px; background: var(--lake-tint); color: var(--lake); font-weight: 600; font-size: 14px; }

/* ---- notes, kinds of advice ---- */
.note { display: flex; flex-direction: column; gap: 8px; }
.kind-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.kind-tag.general { color: var(--ink-3); } .kind-tag.personal { color: var(--spruce); } .kind-tag.gp { color: var(--iris); }
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; font-size: 15px; line-height: 1.45; background: var(--fill); }
.callout > .i { margin-top: 1px; color: var(--ink-2); }
.callout.gp { background: var(--iris-tint); } .callout.gp > .i { color: var(--iris); }
.callout.good { background: var(--spruce-tint); } .callout.good > .i { color: var(--spruce); }
.callout.warm { background: var(--ochre-tint); } .callout.warm > .i { color: var(--ochre); }
.nudge { display: flex; gap: 14px; align-items: flex-start; }
.nudge .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--spruce-tint); color: var(--spruce); flex: none; }
.est { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ochre); }
.ev { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.ev::before { content: ''; width: 8px; height: 8px; border-radius: 2px; display: block; }
.ev-strong { color: var(--spruce); } .ev-strong::before { background: var(--spruce); }
.ev-good { color: var(--spruce); } .ev-good::before { background: var(--spruce-soft); }
.ev-some { color: var(--ochre); } .ev-some::before { background: var(--ochre); }
.ev-mixed { color: var(--ochre); } .ev-mixed::before { background: linear-gradient(90deg, var(--ochre) 50%, var(--track) 50%); }
.ev-not { color: var(--brick); } .ev-not::before { background: var(--brick); }
.ev-depends { color: var(--iris); } .ev-depends::before { background: var(--iris); }

/* ---- tab bar ---- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--tabbar); backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px); border-top: .5px solid var(--line-strong); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.tabbar button .i { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--spruce); }

/* ---- sheets, toast ---- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; opacity: 0; transition: opacity .28s; }
.scrim.in { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: calc(100% - 44px - env(safe-area-inset-top, 0px)); background: var(--canvas); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .34s cubic-bezier(.2, .9, .25, 1); max-width: 560px; margin: 0 auto; }
.sheet.in { transform: none; }
.sheet.full { top: 0; max-height: none; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); }
.sheet-h { display: flex; align-items: center; gap: 6px; padding: 14px 12px 8px 20px; flex: none; }
.sheet-h .h2 { flex: 1; min-width: 0; }
.sheet-h .done { color: var(--spruce); font-weight: 600; padding: 8px 8px; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 7px auto 0; flex: none; }
.sheet-b { overflow-y: auto; padding: 6px var(--gutter) calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-b > * { flex-shrink: 0; }
.sheet-f { flex: none; padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom, 0px)); border-top: .5px solid var(--line-strong); background: var(--canvas); display: flex; gap: 10px; }
.sheet-f .btn { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 70; background: var(--ink); color: var(--canvas); border-radius: 14px; padding: 12px 16px; display: flex; gap: 16px; align-items: center; font-weight: 500; font-size: 15px; opacity: 0; transition: .25s; max-width: calc(100% - 32px); width: max-content; line-height: 1.35; }
.toast.in { opacity: 1; transform: translate(-50%, 0); }
.toast button { color: var(--canvas); font-weight: 700; white-space: nowrap; opacity: .85; }

/* ---- meal detail and editing ---- */
.macros { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; }
.macros span { white-space: nowrap; }
.macros > div { padding: 12px 6px; text-align: center; }
.macros > div + div { border-left: 1px solid var(--line); }
.macros b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.macros span { font-size: 13px; color: var(--ink-3); }
.ing { display: flex; justify-content: space-between; gap: 12px; padding: 12px 18px; }
.ing .a { color: var(--ink-2); text-align: right; flex: none; max-width: 56%; font-variant-numeric: tabular-nums; }
.ing .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; margin-top: 7px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 14px; padding: 0; margin: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; line-height: 1.5; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--serif); font-size: 19px; color: var(--ink-3); line-height: 1.3; }
.edit-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 12px 10px 12px 18px; align-items: center; }
.edit-row .kc { font-size: 13px; color: var(--ink-2); text-align: right; padding-right: 8px; }
.edit-row .sub:empty { display: none; }
.edit-row .nm { font-weight: 500; min-width: 0; display: flex; gap: 8px; align-items: center; }
.edit-row .nm button { text-align: left; }
.edit-row .qty { display: flex; align-items: center; gap: 6px; }
.edit-row .qty input { width: 76px; min-height: 38px; padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; }
.edit-row .qty select { width: auto; max-width: 150px; min-height: 38px; padding: 6px 8px; font-size: 16px; }
.edit-row .sub { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.edit-row .sub .assumed { color: var(--ochre); font-weight: 600; }
.edit-row .rm { color: var(--ink-3); }
.totals { display: flex; flex-direction: column; gap: 6px; }
.totals .big { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.totals .big small { font-size: 15px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; }
.qbox { display: flex; flex-direction: column; gap: 12px; }
.qbox .q { display: flex; flex-direction: column; gap: 8px; }
.qbox .q .lbl { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.input-big { font-size: 19px; min-height: 96px; border-radius: 16px; padding: 14px 16px; font-family: var(--sans); }
.photo-drop { display: flex; gap: 12px; align-items: center; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--spruce); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- lists of recipes / meals ---- */
.mlist .item { align-items: flex-start; }
.mlist .item .spec { margin-top: 8px; max-width: 160px; }
.fav { color: var(--brick); }

/* ---- workout ---- */
.ex-block { background: var(--surface); border-radius: var(--r-group); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.ex-block .exn { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.ex-block.complete { background: var(--raised); }
.sugg { font-size: 15px; color: var(--ink-2); line-height: 1.45; display: flex; gap: 10px; }
.sugg .i { color: var(--spruce); margin-top: 1px; }
.sugg.hold .i { color: var(--ochre); }
.set-head, .set { display: grid; grid-template-columns: 26px 1fr 1fr 46px; gap: 8px; align-items: center; }
.set-head { font-size: 12px; color: var(--ink-3); font-weight: 600; text-align: center; }
.set .sn { color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }
.set .inp { display: flex; align-items: center; background: var(--fill); border-radius: 11px; height: 46px; overflow: hidden; }
.set .inp button { width: 32px; height: 46px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.set .inp input { border: 0; background: transparent; text-align: center; padding: 0; min-height: 0; height: 46px; font-weight: 600; font-size: 17px; width: 100%; min-width: 0; box-shadow: none; font-variant-numeric: tabular-nums; }
.set.is-done .inp { background: var(--spruce-tint); }
.set .tick { width: 44px; height: 44px; }
.feel { display: flex; gap: 6px; }
.feel button { flex: 1; min-height: 36px; border-radius: 10px; background: var(--fill); font-weight: 500; font-size: 14px; color: var(--ink-2); }
.feel button[aria-pressed="true"] { background: var(--ink); color: var(--canvas); }

.week7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.check { display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; width: 100%; text-align: left; }

  let a = seed >>> 0;

function hmToMin(hm) { const [h, m] = (hm || '0:0').split(':').map(Number); return h * 60 + (m || 0); }

const ZERO = () => ({ k: 0, p: 0, c: 0, f: 0, fb: 0, sf: 0, ca: 0 });
const addNut = (a, b, m = 1) => { for (const k of NUT_KEYS) a[k] += ((b && b[k]) || 0) * m; return a; };

/* choose defaults from the words she typed */
function dishInit(dish, text) {
  const sel = {};
  for (const q of dish.ask) {
    const hits = q.opts.map((o, i) => (o.kw && o.kw.test(text)) ? i : -1).filter(i => i >= 0);
    if (q.many) sel[q.id] = { v: hits.length ? (q.id === 'fill' && dish.id === 'sandwich' && !hits.includes(7) && /salad/i.test(text) ? hits.concat(7) : hits) : (Array.isArray(q.def) ? q.def.slice() : []), told: hits.length > 0 };
    else sel[q.id] = { v: hits.length ? hits[hits.length - 1] : q.def, told: hits.length > 0 };
  }
  if (dish.id === 'sandwich' && SHOP_WORDS.test(text) && !sel.src.told) { sel.src.v = 2; }
  return sel;
}
/* expand the choices into [foodId, grams] rows */
function dishRows(dish, sel) {
  const nQ = dish.ask.find(q => q.count);
  const slices = nQ ? nQ.opts[sel[nQ.id].v].n : 1;
  const scales = {};
  for (const q of dish.ask) if (q.targets) { const o = q.opts[sel[q.id].v]; for (const t of q.targets) scales[t] = (scales[t] || 1) * (o.x || 1); }
  const rows = [];
  for (const q of dish.ask) {
    if (q.count || q.targets) continue;
    const picks = q.many ? sel[q.id].v : [sel[q.id].v];
    for (const i of picks) {
      const o = q.opts[i]; if (!o || !o.add) continue;
      for (const [fid, g] of o.add) {
        const grams = g * (o.ps ? slices : 1) * (scales[q.id] || 1);
        const ex = rows.find(r => r.fid === fid);
        if (ex) ex.g += grams; else rows.push({ fid, g: grams });
      }
    }
  }
  return rows.map(r => ({ fid: r.fid, g: Math.round(r.g) }));
}
function dishAssumed(dish, sel) { return dish.ask.filter(q => !q.hide && !sel[q.id].told).map(q => q.q.toLowerCase()); }
function findDish(text) { return DISHES.find(d => d.match.test(text)) || null; }

/* parts: [{fid, g}] */
function spectrumParts(parts, max = 6) {
  const list = parts.filter(p => p.g > 0 && foodById(p.fid) && p.fid !== 'spice').map(p => ({ fid: p.fid, g: p.g }));
  const merged = {};
  for (const p of list) merged[p.fid] = (merged[p.fid] || 0) + p.g;
  const sorted = Object.entries(merged).map(([fid, g]) => ({ fid, g })).sort((a, b) => b.g - a.g);
  if (sorted.length <= max) return sorted;
  const top = sorted.slice(0, max - 1), rest = sorted.slice(max - 1);
  top.push({ fid: '_rest', g: sum(rest.map(r => r.g)), n: rest.length });
  return top;
}
function spectrum(parts, cls = '') {
  const s = spectrumParts(parts);
  if (!s.length) return `<span class="spec ${cls} spec-empty" aria-hidden="true"></span>`;

}
function spectrumLegend(parts) {
  const s = spectrumParts(parts, 8);
  return `<ul class="spec-legend">${s.map(p => `<li><i style="background:${p.fid === '_rest' ? '#B9B3A8' : foodColour(p.fid)}"></i>${p.fid === '_rest' ? `${p.n} more` : esc(shortFoodName(p.fid))}</li>`).join('')}</ul>`;
}
function shortFoodName(fid) {
  const f = foodById(fid); if (!f) return fid;
  return f.n.replace(/, (raw|dry|cooked|tinned.*|2% fat|0% fat|full fat)$/i, '').replace(/ \(.*\)$/, '');
}
/* parts for a planned/logged thing */
function recipeParts(r, s = 1, over) { return r.ing.map(([fid], i) => ({ fid, g: ingGrams(r, i, s, over) })); }

const KCAL_FLOOR = 1300;
function estimateTargets(p, weightNow) {
  const w = weightNow || p.weightKg || 60, h = p.heightCm || 162, age = p.age || 50;
  const bmr = 10 * w + 6.25 * h - 5 * age - 161;
  const mult = { light: 1.4, moderate: 1.55, active: 1.7 }[p.activity] || 1.55;
  const maintenance = bmr * mult;
  const goalHigh = p.goalHigh || w;
  const losing = p.phase !== 'maintain' && w > goalHigh + 0.3;
  let kcal = losing ? maintenance * 0.875 : maintenance;
  kcal = Math.max(KCAL_FLOOR, round(kcal, 50));
  return {
    kcal, maintenance: round(maintenance, 10), protein: round(w * 1.8, 5), calcium: 1000, fibre: 30,
    satfat: Math.round(kcal * 0.1 / 9), steps: 7500, water: round(w * 32, 100),

}

  const t = todayKey();

    const k = addDays(t, -i), P = S.plan[k], L = S.log[k];
    if (!P || !L || !L.items.length) continue;
    for (const m of P.meals) {
      if (m.settled || isEaten(k, m.id) || m.slot === 'treat') continue;
      const ateOther = L.items.some(it => it.slot === m.slot && !it.mealId);
      if (ateOther) { recipePref(m.r).ign = (recipePref(m.r).ign || 0) + 1; }

}

/* ---------- day and week numbers ---------- */

  const d = ws.diff, per = Math.max(1, ws.logged);
  if (d > 220 * per) return { tone: 'calm', text: `A bit above plan so far, about ${fmtInt(d / per)} kcal a day. Weeks like this happen; carrying on as normal is all that's needed.` };
  if (d > 80 * per) return { tone: 'good', text: `Slightly above plan, which won't materially change your progress. No need to adjust anything.` };
  if (d < -250 * per) return { tone: 'care', text: `You've eaten less than planned this week. Eating too little makes it harder to keep muscle and energy, so please don't skip meals to get ahead.` };

/* ---------- protein help: foods she likes, not shakes ---------- */

/* ---------- how a treat sits in the week ---------- */

/* find every food mentioned in a phrase, longest names first, without overlaps */
function scanFoods(phrase) {
  const p = ' ' + phrase.replace(/[^a-z0-9&%' ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const cands = [];
  for (const { f, keys } of foodIndex()) for (const k of keys) {
    const kk = k.replace(/[^a-z0-9&%' ]/g, ' ').replace(/\s+/g, ' ').trim();
    if (kk.length < 3) continue;
    const variants = [kk, kk.endsWith('s') ? kk.slice(0, -1) : kk + 's'];
    for (const v of variants) {
      let idx = p.indexOf(' ' + v + ' ');
      while (idx >= 0) { cands.push({ f, start: idx, end: idx + v.length + 1, len: v.length, score: v.length * 10 + (f.rank || 0) * 3 + (f.custom ? 4 : 0) }); idx = p.indexOf(' ' + v + ' ', idx + 1); }
    }
  }
  cands.sort((a, b) => b.len - a.len || b.score - a.score);
  const taken = [], out = [];
  for (const c of cands) {
    if (taken.some(t => c.start < t.end && t.start < c.end)) continue;
    if (out.some(o => o.f.id === c.f.id)) continue;
    taken.push(c); out.push(c);

  ['chicken and mushroom', 'chicken§mushroom'], ['chicken and leek', 'chicken§leek'], ['salt and pepper', ''], ['salt & pepper', ''], ['fish and chips', 'fish§chips'], ['bread and butter', 'bread§butter'], ['carrot and coriander', 'carrot§coriander'], ['peanut butter and jam', 'peanut butter§jam'], ['scone with jam and cream', 'scone§jam§cream'], ['jam and cream', 'jam§cream']];

/* returns entries: {type:'food', fid, g, assumed, approx, text} | {type:'dish', dish, sel, text} | {type:'unknown', text} */

    const parts = seg0.split(/\s+(?:and|with|&|n)\s+/).map(x => x.replace(/§/g, ' and ').trim()).filter(Boolean);

    const note = (line.match(/\(([^)]+)\)/) || [])[1] || '';
    if (ex && !cardio) {
      let sets = [];
      if (sx) {
        const n = +sx[1], reps = [sx[2], sx[3], sx[4]].filter(Boolean).map(Number);
        for (let i = 0; i < n; i++) sets.push({ w: w != null ? w : (ex.kind === 'load' || ex.kind === 'carry' ? 0 : null), r: reps[Math.min(i, reps.length - 1)], done: true });
      } else if (setsOnly || repsOnly) {
        const n = setsOnly ? +setsOnly[1] : 1, r = repsOnly ? +repsOnly[1] : (ex.reps ? ex.reps[0] : 10);
        for (let i = 0; i < n; i++) sets.push({ w, r, done: true });
      } else if (minutes && ex.kind === 'time') sets.push({ r: minutes * 60, done: true });
      else sets.push({ w, r: ex.reps ? ex.reps[0] : (ex.secs ? (Array.isArray(ex.secs) ? ex.secs[0] : ex.secs) : 10), done: true, guessed: true });
      const rp = rpe ? parseFloat(rpe[1]) : rir ? 10 - +rir[1] : null;
      if (rp) sets.forEach(s => s.rpe = rp);
      out.push({ type: 'strength', ex: ex.id, sets, note, text: line });
    } else if (cardio || minutes || dist) {
      const c = cardio || CARDIO.other;
      const km = dist ? parseFloat(dist[1]) * (/mi/.test(dist[2]) ? 1.609 : 1) : null;
      out.push({ type: 'cardio', cid: c.id, min: minutes || (km ? Math.round(km * (c.id === 'run' ? 6.5 : c.id === 'cycle' ? 3 : 12)) : 30), km, effort: effort || (c.vig ? 'hard' : 'moderate'), note, text: line, guessedMin: !minutes });
    } else if (sx || kg) {
      const name = cap(line.replace(/(\d+\s*(x|×|sets? of)\s*\d+.*)|(@?\s*\d+(\.\d+)?\s*(kg|lb)s?.*)/i, '').replace(/[-–—:]+\s*$/, '').trim()) || 'Exercise';
      const n = sx ? +sx[1] : 1, r = sx ? +sx[2] : 10;
      out.push({ type: 'strength', ex: null, newName: name, sets: Array.from({ length: n }, () => ({ w, r, done: true })), note, text: line });
    } else out.push({ type: 'unknown', text: line });
  }
  return out;
}

/* ---------- meal prep & shopping ----------
   Food-safety rules follow UK guidance: cool cooked food and refrigerate within 1–2 hours,
   eat leftovers within 48 hours, cooked rice within 24 hours, use defrosted food within
   24 hours, reheat once until steaming hot, fridge at 0–5°C. */

/* which days a week-prep covers: the whole week, or from today if we're already in it */
function prepRange(ws) {
  const t = todayKey();
  const done = S.prep[ws] && S.prep[ws].date;   // once she's started prepping, the plan is fixed to that day
  if (done) return { ws, days: weekDays(ws).filter(d => d >= done), prepDate: done, fixed: true };
  const from = ws > t ? ws : t;
  const days = weekDays(ws).filter(d => d >= from);
  const prepDate = ws > t ? addDays(ws, -1) : t; // the Sunday before, or today
  return { ws, days, prepDate, fixed: false };
}

const PREP_RULES = {
  chicken: { fridgeDays: 2, freeze: true },
  rice:    { fridgeDays: 1, freeze: true },
  roast:   { fridgeDays: 2, freeze: true },
  pasta:   { fridgeDays: 2, freeze: false },
  dish:    { fridgeDays: 2, freeze: true },
  oats:    { fridgeDays: 3, freeze: false },
  veg:     { fridgeDays: 4, freeze: false }
};
const BATCH_DISHES = ['chowder', 'curry'];

function buildPrep(ws) {
  const { days, prepDate, fixed } = prepRange(ws);
  const comp = { chicken: [], rice: [], roast: [], pasta: [], oats: [], veg: {}, dish: {} };
  const batches = new Set(), dishCount = {};
  for (const d of days) for (const m of (S.plan[d] || { meals: [] }).meals) if (BATCH_DISHES.includes(m.r) && (fixed || !isEaten(d, m.id))) dishCount[m.r] = (dishCount[m.r] || 0) + 1;
  for (const d of days) {
    for (const m of (S.plan[d] || { meals: [] }).meals) {
      if (!fixed && isEaten(d, m.id)) continue;
      if ((mealRecipe(m.r) || {}).batch === 'bites' || (mealRecipe(m.r) || {}).batch === 'bark') batches.add(mealRecipe(m.r).batch);
      const r = mealRecipe(m.r), off = daysBetween(prepDate, d);
      if (!r) continue;
      if (dishCount[r.id] >= 2) { (comp.dish[r.id] = comp.dish[r.id] || []).push({ d, off, m, r }); continue; }
      if (r.batch === 'oats') comp.oats.push({ d, off, m, r });
      r.ing.forEach(([fid0, , o0], i) => {
        let fid = fid0, o = o0, g = ingGrams(r, i, m.s || 1, m.g);
        if (r.mine && RAW_OF[fid0]) { const rw = RAW_OF[fid0]; if (!rw.prep) return; fid = rw.fid; g = Math.round(g * rw.x); o = { prep: rw.prep }; }
        if (!o || !o.prep) return;
        if (o.prep === 'veg') { if (off <= PREP_RULES.veg.fridgeDays) comp.veg[fid] = (comp.veg[fid] || 0) + g; return; }
        if (o.prep === 'jacket') return;
        if (comp[o.prep]) comp[o.prep].push({ d, off, m, r, g, fid });
      });
    }
  }
  const steps = [];
  const store = rule => use => use.off <= PREP_RULES[rule].fridgeDays ? 'fridge' : (PREP_RULES[rule].freeze ? 'freezer' : 'fresh');
  const totalG = arr => sum(arr.map(u => u.g));
  const usesText = arr => arr.map(u => `${DOW_SHORT[dow(u.d)]} ${SLOT_LABEL[u.m.slot].toLowerCase()}`).join(', ');
  const needOven = comp.chicken.length || comp.roast.length;
  if (needOven) steps.push({ id: 'oven', title: 'Heat the oven', text: '200°C (180°C fan). Line two trays.', min: 0 });
  if (comp.roast.length) {
    const g = totalG(comp.roast);
    steps.push({ id: 'roast', title: `Roast ${fmtGrams(round(g, 50))} potatoes`, text: `Cut into chunks, toss with 1 tbsp olive oil, rosemary and salt. Roast 35–40 minutes, turning once, until golden.`, uses: comp.roast, min: 40, comp: 'roast' });
  }
  if (comp.chicken.length) {
    const g = totalG(comp.chicken);
    steps.push({ id: 'chicken', title: `Cook ${fmtGrams(round(g, 10))} chicken breast`, text: `About ${Math.max(1, Math.round(g / 160))} fillets. Season with olive oil, salt, pepper, garlic granules and a little smoked paprika. Roast 20–25 minutes until there's no pink and the juices run clear (75°C in the thickest part). Plain seasoning works for every meal this week; each recipe adds its own flavour.`, uses: comp.chicken, min: 25, comp: 'chicken' });
  }
  if (comp.rice.length) {
    const g = totalG(comp.rice);
    steps.push({ id: 'rice', title: `Cook ${round(g, 5)} g rice`, text: `That's about ${fmtGrams(round(g * FOODS.rice.cookedX, 10))} cooked. Rinse, simmer 10–12 minutes, then spread on a tray so it cools fast. Portion it within an hour of cooking.`, uses: comp.rice, min: 15, comp: 'rice' });
  }
  if (comp.pasta.length) {
    const g = totalG(comp.pasta);
    const now = comp.pasta.filter(u => u.off <= 2);
    if (now.length) steps.push({ id: 'pasta', title: `Cook ${round(totalG(now), 5)} g pasta for salads`, text: 'Cook, rinse under cold water and drain well. Toss with a drop of oil so it doesn\'t stick. Pasta salads are best within 2 days, so later ones are made fresh.', uses: now, min: 12, comp: 'pasta' });
  }
  for (const [rid, uses] of Object.entries(comp.dish)) {
    const r = mealRecipe(rid);
    steps.push({ id: 'dish-' + rid, title: `Make ${uses.length} ${plural(uses.length, 'portion')} of ${r.name.toLowerCase()}`, text: `Follow the recipe, multiplying everything by ${uses.length}. ${r.store || ''}`, uses, min: r.cook + r.prep, comp: 'dish', rid });
  }
  const vegList = Object.entries(comp.veg).filter(([, g]) => g > 0);
  if (vegList.length) {
    const vtxt = vegList.map(([f, g]) => f === 'pepper' ? `${Math.ceil(g / 160)} ${plural(Math.ceil(g / 160), 'pepper')} into strips` : f === 'broccoli' ? `${fmtGrams(round(g, 10))} broccoli into florets` : f === 'greenbeans' ? `${fmtGrams(round(g, 10))} green beans, trimmed` : f === 'onion' ? `${Math.ceil(g / 150)} red ${plural(Math.ceil(g / 150), 'onion')}, sliced` : `${fmtGrams(g)} ${foodById(f).n.toLowerCase()}`);
    steps.push({ id: 'veg', title: 'Chop the veg for the next four days', text: 'Wash and chop: ' + vtxt.join('; ') + '. Keep in tubs lined with kitchen paper. Veg for later in the week stays fresher left whole.', min: 15, comp: 'veg' });
  }
  const oatsNow = comp.oats.filter(u => u.off <= 3);
  if (oatsNow.length) steps.push({ id: 'oats', title: `Make ${oatsNow.length} ${plural(oatsNow.length, 'jar')} of overnight oats`, text: `For ${usesText(oatsNow)}. Each jar: 40 g oats, 100 ml milk, 110 g yoghurt, berries on top. Add the rest of the yoghurt, seeds and honey on the morning.`, uses: oatsNow, min: 5, comp: 'oats' });
  if (batches.has('bites')) steps.push({ id: 'bites', title: 'Make 12 date & coconut bites', text: RECIPE['date-bites'].steps.join(' '), min: 15 });
  if (batches.has('bark')) steps.push({ id: 'bark', title: 'Make the frozen yoghurt bark', text: RECIPE['yog-bark'].steps.join(' '), min: 10 });
  const portionUses = [...comp.chicken, ...comp.rice, ...comp.roast, ...comp.pasta.filter(u => u.off <= 2), ...Object.values(comp.dish).flat()];
  if (portionUses.length) steps.push({ id: 'portion', title: 'Portion into labelled tubs', text: 'Once everything has cooled (no more than 1–2 hours out), split it into one tub per meal using the guide below. Label each lid with the day.', min: 10 });
  for (const s of steps) s.min = s.min || 0;

  /* portion guide: one row per meal */
  const rows = {};
  const rowFor = u => { const key = u.d + u.m.id; if (!rows[key]) rows[key] = { d: u.d, off: u.off, m: u.m, r: u.r, parts: [], where: 'fridge' }; return rows[key]; };
  for (const [kind, arr] of [['chicken', comp.chicken], ['rice', comp.rice], ['roast', comp.roast], ['pasta', comp.pasta.filter(u => u.off <= 2)]]) {
    for (const u of arr) {
      const row = rowFor(u);
      const label = kind === 'chicken' ? `${round(u.g * FOODS.chicken.cooked, 5)} g chicken` : kind === 'rice' ? `${round(u.g * FOODS.rice.cookedX, 5)} g rice` : kind === 'roast' ? `${round(u.g * 0.8, 10)} g potatoes` : `${round(u.g * FOODS.pasta.cookedX, 10)} g pasta`;
      row.parts.push(label);
      if (store(kind)(u) === 'freezer') row.where = 'freezer';
    }
  }
  for (const [rid, uses] of Object.entries(comp.dish)) for (const u of uses) { const row = rowFor(u); row.parts.push('1 portion'); if (store('dish')(u) === 'freezer') row.where = 'freezer'; }
  const guide = Object.values(rows).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : SLOT_ORDER[a.m.slot] - SLOT_ORDER[b.m.slot]);
  const nFridge = guide.filter(g => g.where === 'fridge').length, nFreeze = guide.filter(g => g.where === 'freezer').length;
  if (guide.length) steps.push({ id: 'store', title: nFreeze ? 'Fridge the next two days, freeze the rest' : 'Into the fridge', text: `Fridge (0–5°C): ${nFridge} ${plural(nFridge, 'tub')}.` + (nFreeze ? ` Freezer: ${nFreeze} ${plural(nFreeze, 'tub')}. Each evening, move the next day's tubs from the freezer to the fridge to defrost, and eat within 24 hours.` : '') + ' Reheat once, until steaming hot all the way through. Cold chicken is fine for sandwiches and salads.', min: 2 });
  const totalMin = needOven ? Math.max(40, sum(steps.filter(s => !['roast', 'chicken'].includes(s.id)).map(s => s.min)) + 15) : sum(steps.map(s => s.min));
  return { ws, prepDate, days, steps, guide, comp, totalMin: round(totalMin, 5) };
}
function compOf(u) { return u.r && BATCH_DISHES.includes(u.r.id) ? 'dish' : (u.fid === 'chicken' ? 'chicken' : u.fid === 'rice' ? 'rice' : u.fid === 'potato' ? 'roast' : u.fid === 'pasta' ? 'pasta' : 'chicken'); }
function prepState(ws) { if (!S.prep[ws]) S.prep[ws] = { done: {} }; return S.prep[ws]; }

/* tubs to move from freezer to fridge tonight, for tomorrow */
function freezerTonight() {
  const t = todayKey(), tm = addDays(t, 1);
  const ws = weekStart(tm);
  const pstate = S.prep[ws] || S.prep[weekStart(t)];
  if (!pstate || !pstate.done || !pstate.done.store) return null;
  const P = buildPrepCached(ws);
  const rows = P.guide.filter(r => r.d === tm && r.where === 'freezer');
  return rows.length ? rows : null;
}
let _prepCache = { key: '', val: null };
function buildPrepCached(ws) {
  const key = ws + JSON.stringify(weekDays(ws).map(d => S.plan[d]));
  if (_prepCache.key !== key) _prepCache = { key, val: buildPrep(ws) };
  return _prepCache.val;
}

/* ---------- shopping list ---------- */
function buyFor(fid, g) {
  const f = foodById(fid), b = f.buy || {};
  if (b.each) {
    const n = Math.max(1, Math.ceil(g / b.each - 0.15));
    return { text: `${n} ${n === 1 ? b.one : b.many}`, buyG: n * b.each };
  }
  if (b.count) {
    const ug = (f.unit && f.unit.g) || f.each || 50;
    const units = Math.ceil(g / ug - 0.05);
    const box = b.count.find(c => c >= units) || b.count[b.count.length - 1];
    const boxes = Math.ceil(units / box);
    return { text: fid === 'egg' ? `${boxes > 1 ? boxes + ' × ' : ''}${box} eggs` : `${boxes} × ${b.label}${box > 1 ? ` of ${box}` : ''}`, buyG: boxes * box * ug, units };
  }
  if (b.sizes) {
    const sizes = b.sizes.slice().sort((a, c) => a - c);
    let best = null;
    // try combinations of up to 4 packs
    const rec = (i, left, used, packs) => {
      if (left <= 0) { const waste = -left, score = waste + packs.length * Math.max(60, sizes[0] * 0.35); if (!best || score < best.score) best = { waste, score, packs: packs.slice(), total: used }; return; }
      if (packs.length >= 4) return;
      for (let j = i; j < sizes.length; j++) { packs.push(sizes[j]); rec(j, left - sizes[j], used + sizes[j], packs); packs.pop(); }
    };
    rec(0, g, 0, []);
    if (!best) { const big = sizes[sizes.length - 1], n = Math.ceil(g / big); best = { waste: n * big - g, packs: Array(n).fill(big), total: n * big }; }
    const names = b.names || {};
    const counts = {}; best.packs.forEach(p => counts[p] = (counts[p] || 0) + 1);
    const text = Object.entries(counts).sort((a, c) => c[0] - a[0]).map(([sz, n]) => `${n > 1 ? n + ' × ' : ''}${names[sz] || fmtGrams(+sz)} ${b.label}${n > 1 && !names[sz] ? 's' : ''}`).join(' + ');
    return { text: b.loose ? `${fmtGrams(round(g, 100))} loose, or ${text}` : text, buyG: best.total };
  }
  return { text: fmtGrams(g), buyG: g };
}

function shopState(ws) { if (!S.shop[ws]) S.shop[ws] = { st: {}, custom: [] }; return S.shop[ws]; }

function buildShop(ws) {
  const { days, fixed } = prepRange(ws);
  const need = {}, uses = {}, batchSeen = new Set();
  for (const d of days) for (const m of (S.plan[d] || { meals: [] }).meals) {
    if (!fixed && isEaten(d, m.id)) continue;
    const r = mealRecipe(m.r); if (!r) continue;
    if (r.batch === 'bites' || r.batch === 'bark') { if (batchSeen.has(r.id)) continue; batchSeen.add(r.id); }
    r.ing.forEach(([fid0], i) => {
      let fid = fid0, g = ingGrams(r, i, m.s || 1, m.g);
      if (RAW_OF[fid0]) { fid = RAW_OF[fid0].fid; g = g * RAW_OF[fid0].x; }
      const f = foodById(fid); if (!f || f.nolist) return;
      if (r.makes && (r.batch === 'bites' || r.batch === 'bark')) g = g * r.makes;
      need[fid] = (need[fid] || 0) + g;
      (uses[fid] = uses[fid] || new Set()).add(r.id);
    });
  }
  // a planned batch recipe only needs buying once per week
  const st = shopState(ws);
  const items = [];
  for (const [fid, g] of Object.entries(need)) {
    const f = foodById(fid), b = buyFor(fid, g), u = st.st[fid] || {};
    if (u.removed) continue;
    const spare = b.buyG - g;
    items.push({
      key: fid, fid, name: f.n, cat: f.cat, needG: g, need: g >= 1000 && !f.unit ? fmtGrams(round(g, 50)) + (fid === 'chicken' ? ' raw' : '') : fmtAmount(fid, g).replace(/ \(about.*\)/, ''),
      buy: u.qty || b.text, pantry: !!f.pantry, freezer: !!f.freezer,
      spare: f.shelf && spare > Math.max(60, g * 0.25) ? spare : 0, meals: uses[fid].size, checked: !!u.checked, edited: !!u.qty
    });
  }
  for (const r of S.regulars) {
    const u = st.st['reg-' + r.id] || {};
    if (u.removed) continue;
    items.push({ key: 'reg-' + r.id, name: r.name, cat: r.cat, buy: u.qty || r.qty, regular: true, checked: !!u.checked, regId: r.id });
  }
  for (const c of st.custom) items.push({ key: c.id, name: c.name, cat: c.cat, buy: c.qty, custom: true, checked: !!c.checked });
  return items;
}
function shopToggle(ws, key) {
  const st = shopState(ws);
  const c = st.custom.find(x => x.id === key);
  if (c) c.checked = !c.checked;
  else { st.st[key] = st.st[key] || {}; st.st[key].checked = !st.st[key].checked; st.st[key].boughtAt = st.st[key].checked ? todayKey() : null; }
  save();
}
function shopRemove(ws, key) {
  const st = shopState(ws);
  const i = st.custom.findIndex(x => x.id === key);
  if (i >= 0) st.custom.splice(i, 1); else { st.st[key] = st.st[key] || {}; st.st[key].removed = true; }
  save();
}
function shopSetQty(ws, key, qty) {
  const st = shopState(ws);
  const c = st.custom.find(x => x.id === key);
  if (c) c.qty = qty; else { st.st[key] = st.st[key] || {}; st.st[key].qty = qty; }
  save();
}
function shopAdd(ws, name, cat, qty) { shopState(ws).custom.push({ id: 'c-' + uid(), name, cat: cat || 'Other', qty: qty || '', checked: false }); save(); }
function shopRestore(ws) { const st = shopState(ws); for (const k in st.st) delete st.st[k].removed; save(); }

/* cooked forms in her own meals are bought and prepped raw */
const RAW_OF = {
  'chicken-c': { fid: 'chicken', x: 1 / 0.75, prep: 'chicken' }, 'chicken-slices': { fid: 'chicken', x: 1 / 0.75 },
  'rice-c': { fid: 'rice', x: 1 / 2.5, prep: 'rice' }, 'pasta-c': { fid: 'pasta', x: 1 / 2.3, prep: 'pasta' },
  'potato-boiled': { fid: 'potato', x: 1 }, 'potato-jacket': { fid: 'potato', x: 1.15, prep: 'jacket' }, 'potato-roast': { fid: 'potato', x: 1.25, prep: 'roast' },
  'yog-0': { fid: 'yoghurt', x: 1 }
};

/* ---------- use-soon: perishables bought and not yet planned before they go over ---------- */
function useSoonItems() {
  const t = todayKey(), out = [];
  for (const ws of [weekStart(t), addDays(weekStart(t), -7), addDays(weekStart(t), 7)]) {
    const st = S.shop[ws]; if (!st) continue;
    for (const [fid, u] of Object.entries(st.st)) {
      const f = foodById(fid); if (!f || !f.shelf || !u.checked || !u.boughtAt || u.usedUp) continue;
      const useBy = addDays(u.boughtAt, f.shelf);
      const left = daysBetween(t, useBy);
      if (left < 0 || left > 1) continue;
      const usedInPlan = [t, addDays(t, 1)].some(d => openPlanned(d).some(m => { const r = mealRecipe(m.r); return r && r.ing.some(([x]) => x === fid); }));
      out.push({ ws, fid, name: f.n, useBy, left, usedInPlan, tip: spareTip(fid) });
    }
  }
  return out.filter(x => !x.usedInPlan).sort((a, b) => a.left - b.left);
}
function spareTip(fid) {
  return ({ yoghurt: 'have an extra yoghurt pot as a snack', cottage: 'spread it on crispbreads', sourdough: 'slice and freeze what’s left', spinach: 'wilt it into eggs, pasta or a curry',
    tomatoes: 'add them to lunch', cucumber: 'cut into snack sticks', leaves: 'have a side salad', broccoli: 'blanch and freeze the florets', greenbeans: 'add them to dinner',
    salsa: 'it keeps a week once open', avocado: 'have it on toast', pepper: 'cut into snack sticks', kiwi: 'add to your yoghurt bowl', banana: 'freeze slices for porridge' })[fid] || 'use it in your next meal';
}

/* ---------- progression: double progression with RPE / reps in reserve ---------- */

/* ---------- trends, patterns and coaching ----------
   Every message is one of three kinds, shown with a small label:
   general (evidence-based guidance), personal (from her own data), gp (worth asking her GP or care team).
   Patterns are described as things that happen together, never as causes. */

function weightSeries() {
  const keys = Object.keys(S.weights).sort();

    const win = keys.filter(x => x <= k && x > addDays(k, -7)).map(x => S.weights[x]);

}
function slopePerDay(points) {

  let rate = null;
  if (recent.length >= 6 && daysBetween(recent[0].d, last.d) >= 13) rate = slopePerDay(recent.map(p => ({ d: p.d, y: p.kg }))) * 7;

/* ---------- calorie target from her own data ----------
   With three or more weeks of logging and weigh-ins, her real maintenance is estimated from what she ate
   and how her weight trend moved (about 7,700 kcal per kg), instead of from a formula. */

  const logged = days.filter(completeDay);
  const pts = Object.keys(S.weights).filter(k => k >= from && k < t).sort().map(k => ({ d: k, y: S.weights[k] }));
  if (logged.length < 14 || pts.length < 6 || daysBetween(pts[0].d, pts[pts.length - 1].d) < 18) return { ok: false, logged: logged.length, weighs: pts.length };
  const intake = avg(logged.map(d => eatenTotals(d).k));

  }

function fmtSleep(v, unit) { return unit === 'h' ? fmtHM(v * 60) : v.toFixed(1) + ' out of 5'; }

  }

  const wt = weightTrend();
  if (wt) cards.push({ cat: 'Body', kind: 'personal', title: wt.rate == null ? 'Building your weight trend' : wt.inGoal ? 'You’re in your goal range' : wt.rate < -0.05 ? 'Your 4-week trend is moving gradually towards your goal' : 'Your weight is holding steady', text: wt.rate == null ? `${wt.entries} weigh-ins so far. A few more and the trend line settles.` : `7-day average ${fmtKg(wt.current)} kg, ${signed(wt.change)} kg since you started.${wt.eta ? ' At this pace you’d reach your goal range around ' + fmtDate(wt.eta) + '.' : ''}` });
  const rv = targetReview();
  cards.push({ cat: 'Body', kind: rv.gp ? 'gp' : 'personal', title: rv.kind === 'ok' ? 'No change to your calorie target needed' : rv.kind === 'wait' ? 'Calorie check: not enough data yet' : rv.kind === 'maintain' ? 'Time for maintenance' : 'A small calorie adjustment would help', text: rv.text, review: rv.newKcal ? rv : null });
  const recent = Array.from({ length: 5 }, (_, i) => nightSleep(addDays(t, -i))).filter(Boolean);
  const base = Array.from({ length: 30 }, (_, i) => nightSleep(addDays(t, -i - 5))).filter(Boolean);
  if (recent.length >= 4 && base.length >= 14 && recent[0].unit === base[0].unit) {
    const r = avg(recent.map(x => x.v)), b = avg(base.map(x => x.v)), unit = recent[0].unit;
    if ((unit === 'h' && r < b - 0.5) || (unit !== 'h' && r <= b - 0.6)) cards.push({ cat: 'Recovery', kind: 'personal', title: `Sleep has been lower than usual for ${recent.length} days`, text: `Averaging ${fmtSleep(r, unit)} against your usual ${fmtSleep(b, unit)}. Steady is keeping workouts at a moderate effort until it picks up.` });
  }
  for (const p of patterns().slice(0, 3)) cards.push({ cat: p.topic, kind: 'personal', title: 'A pattern in your data', text: p.text, assoc: true });
  return cards;

const BOOT_DEMO = false;

function icon(n, cls = '') { const p = ICONS[n]; return p ? `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>` : ''; }

const UI = { tab: 'today', view: { food: 'diary', progress: 'body', insights: 'you', train: 'today' }, foodDay: null, planDay: null, scroll: {}, sheets: [], kitchen: 'prep', mealsFilter: 'all', mealsQ: '' };
const A = {};                  // actions, by name
const SCREENS = {};            // tab renderers

/* ---------- rendering ---------- */
function render() {
  const app = $('#app');
  if (!app) return;
  if (LOCK.locked) { app.innerHTML = renderLock(); closeAllSheets(true); return; }
  if (!S || !S.onboarded) { app.innerHTML = renderSetup(); return; }
  const y = window.scrollY;
  app.innerHTML = `<main class="screen" id="screen" data-tab="${UI.tab}">${SCREENS[UI.tab]()}</main>${tabbar()}`;
  if (UI._keepScroll) window.scrollTo(0, y); else window.scrollTo(0, UI.scroll[UI.tab] || 0);
  UI._keepScroll = false;
  for (const s of UI.sheets) renderSheet(s);
}
/* re-render after a state change, keeping the scroll position */
function refresh() { UI._keepScroll = true; render(); }

const TABS = [
  { id: 'today', label: 'Today', icon: 'sun' },
  { id: 'food', label: 'Food', icon: 'utensils' },
  { id: 'train', label: 'Train', icon: 'dumbbell' },
  { id: 'progress', label: 'Progress', icon: 'chart-line' },
  { id: 'insights', label: 'Insights', icon: 'lightbulb' }
];
function tabbar() {
  return `<nav class="tabbar" aria-label="Sections"><div class="tabbar-in">${TABS.map(t => `<button data-a="tab" data-t="${t.id}" ${UI.tab === t.id ? 'aria-current="page"' : ''}>${icon(t.icon)}<span>${t.label}</span></button>`).join('')}</div></nav>`;
}
A.tab = d => {
  if (UI.tab === d.t) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  UI.scroll[UI.tab] = window.scrollY;
  UI.tab = d.t;
  render();
};
function goTab(t, view) { UI.scroll[UI.tab] = window.scrollY; UI.tab = t; if (view) UI.view[t] = view; UI.scroll[t] = 0; closeAllSheets(); render(); }

function avatarBtn() {
  const n = (S.profile.name || '').trim();
  return `<button class="avatar" data-a="profile" aria-label="Profile and settings">${n ? esc(n[0].toUpperCase()) : icon('user', 'sm')}</button>`;
}
function header({ eyebrow, title, actions = '' }) {
  return `<header class="hdr"><div class="grow">${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h1 class="title">${title}</h1></div><div class="hdr-actions">${actions}${avatarBtn()}</div></header>`;
}
function seg(name, opts, cur) {
  return `<div class="seg" role="group">${opts.map(([id, label]) => `<button data-a="seg" data-n="${name}" data-v="${id}" aria-pressed="${cur === id}">${label}</button>`).join('')}</div>`;
}
A.seg = d => { const [scope, key] = d.n.split('.'); if (scope === 'view') { UI.view[key] = d.v; UI.scroll[UI.tab] = 0; render(); } else { UI[d.n] = d.v; refresh(); } };

function sampleNote() {
  if (!S.demo) return '';
  return `<div class="sample-note">${icon('flask-conical', 'sm')}<span>You’re looking at five weeks of sample data.</span><button data-a="leaveDemo">Start for real</button></div>`;
}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (!fn) { console.warn('No action', el.dataset.a); return; }
  if (el.tagName === 'A' && el.getAttribute('href') && !el.dataset.keep) e.preventDefault();
  if (el.tagName === 'BUTTON') e.preventDefault();
  try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast('Something went wrong there. Your data is safe.'); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && A[el.dataset.in]) A[el.dataset.in](el.dataset, el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && A[el.dataset.ch]) A[el.dataset.ch](el.dataset, el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheets.length) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter && A[e.target.dataset.enter]) { e.preventDefault(); A[e.target.dataset.enter](e.target.dataset, e.target, e); }
});

const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? null : n; };

/* ---------- sheets ---------- */
function openSheet(s) {
  s.id = s.id || 'sh-' + uid();
  if (s.replace) { const i = UI.sheets.findIndex(x => x.key && x.key === s.key); if (i >= 0) { UI.sheets[i].body = s.body; UI.sheets[i].title = s.title; renderSheet(UI.sheets[i]); return UI.sheets[i]; } }
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.dataset.a = 'closeSheet';
  const el = document.createElement('section');
  el.className = 'sheet' + (s.full ? ' full' : '');
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `${s.full ? '' : '<div class="grab" aria-hidden="true"></div>'}<div class="sheet-h"></div><div class="sheet-b"></div><div class="sheet-f" hidden></div>`;

      <span class="act">${i.tick ? `<button class="tick" data-a="${i.tick}" ${i.data || ''} aria-pressed="${!!i.done}" aria-label="${i.done ? 'Done' : 'Mark done'}">${icon('check', 'sm')}</button>` : (i.done ? `<span class="tick" aria-pressed="true" style="pointer-events:none">${icon('check', 'sm')}</span>` : '')}</span></div>`;

A.tickMeal = d => {
  const k = d.k, id = d.id;
  if (isEaten(k, id)) { const before = deepClone(eatenItem(k, id)); unlogPlanned(k, id); refresh(); toast('Marked as not eaten', { undo: () => { dayLog(k).items.push(before); save(); } }); return; }
  logPlanned(k, id);
  const m = S.plan[k].meals.find(x => x.id === id);
  const msg = m && m.slot === 'treat' ? 'You’ve had your planned treat. You’re still within your weekly range.' : `${mealRecipe(m.r).name} ticked off`;
  refresh();
  toast(msg, { undo: () => unlogPlanned(k, id) });
};
A.goFood = d => goTab('food', d.v || 'diary');
A.planWeek = () => { generatePlan(todayKey(), 7 - dow(todayKey())); refresh(); toast('Meals planned for the rest of the week'); };
A.freezerMoved = d => { const st = prepState(d.ws); st.moved = st.moved || {}; st.moved[d.d] = !st.moved[d.d]; save(); refresh(); };
A.kitchen = d => { if (d.ws === 'next') UI.kitchenWs = addDays(weekStart(todayKey()), 7); else UI.kitchenWs = null; UI.kitchen = 'prep'; goTab('food', 'kitchen'); };

/* ---------- fuel ---------- */

    <div class="group pad fuel">
      ${meter({ name: 'Energy', val: e.k, target: T.kcal, color: 'var(--ochre)', unit: ' kcal', plan: o.k })}
      ${meter({ name: 'Protein', val: e.p, target: T.protein, color: 'var(--spruce)', unit: ' g', plan: o.p })}
      ${meter({ name: 'Calcium', val: e.ca, target: T.calcium, color: 'var(--bone)', unit: ' mg', plan: o.ca })}
      ${meter({ name: 'Fibre', val: e.fb, target: T.fibre, color: 'var(--moss)', unit: ' g', plan: o.fb })}
      <div class="meter"><div class="lbl"><span class="name">Water</span><span class="val"><b>${fmtInt(L.water || 0)}</b> of ${fmtInt(T.water)} ml</span></div>

A.water = d => { const L = dayLog(todayKey()); L.water = Math.max(0, (L.water || 0) + (+d.v)); save(); refresh(); };

/* ---------- recovery ---------- */
function recoverySection(k) {
  const rd = readiness(k), h = S.health.days[k] || {}, steps = daySteps(k), ci = S.checkins[k];
  const src = S.health.sample ? 'Sample Fitbit data, for the preview.' : S.health.connected ? 'From Fitbit. ' + healthLabel() + '.' : 'Connect Fitbit in Profile to add sleep, heart rate and steps automatically.';
  const lead = rd.level ? `<span class="ready ${rd.level}"><span class="dot"></span>${READY_LABEL[rd.level]}</span>` : '<span class="ready">Not enough data yet</span>';
  const why = rd.level ? (rd.reasons.find(r => r.bad) || rd.reasons[0] || {}).text : (ci ? 'Connect Fitbit for sleep and heart data.' : 'Do the morning check-in to see this.');
  const st = (kk, v, unit) => `<div><span class="k">${kk}</span><span class="v">${v == null ? '–' : v}${v != null && unit ? `<small> ${unit}</small>` : ''}</span></div>`;
  return `<section class="section"><div class="sh"><h2 class="h2">Recovery</h2><button class="link" data-a="readiness">Details</button></div>
    <div class="group divided"><button class="item" data-a="readiness"><div class="grow"><div class="t">${lead}</div><div class="s">${esc(why || '')}</div></div>${icon('chevron-right', 'chev')}</button>
      <div class="mini-stats">${st('Sleep', h.sleepMin != null ? fmtHM(h.sleepMin).replace(' ', '') : (ci && ci.sleep ? SLEEP_WORDS[ci.sleep - 1] : null))}${st('Resting HR', h.rhr, 'bpm')}${st('Steps', steps != null ? fmtInt(steps) : null)}</div></div>
    <p class="inset-note">${src}</p></section>`;
}
A.readiness = () => {
  openSheet({ title: 'How recovered you look', body: () => {
    const k = todayKey(), rd = readiness(k), h = S.health.days[k] || {};
    const row = (k1, v, base, unit) => `<div class="kv"><span class="k">${k1}</span><span class="v">${v}${base ? `<span class="sec" style="font-weight:400"> usual ${base}</span>` : ''}</span></div>`;
    return `<div class="group pad stack">
        <p class="h3">${rd.level ? `<span class="ready ${rd.level}"><span class="dot"></span>${READY_LABEL[rd.level]}</span>` : 'Not enough data yet'}</p>
        ${rd.reasons.length ? `<ul class="why">${rd.reasons.map(r => `<li>${esc(r.text)}</li>`).join('')}</ul>` : '<p class="sec small">A morning check-in, or Fitbit sleep and heart data, lets Steady judge how hard to train today.</p>'}
      </div>
      <div class="group pad stack">
        ${h.sleepMin != null ? row('Sleep last night', fmtHM(h.sleepMin), rd.data.sleepBase ? fmtHM(rd.data.sleepBase) : '') : ''}
        ${h.rhr != null ? row('Resting heart rate', h.rhr + ' bpm', rd.data.rhrBase ? Math.round(rd.data.rhrBase) + ' bpm' : '') : ''}
        ${h.hrv != null ? row('Heart rate variability', h.hrv + ' ms', rd.data.hrvBase ? Math.round(rd.data.hrvBase) + ' ms' : '') : ''}
        ${daySteps(k) != null ? row('Steps so far', fmtInt(daySteps(k))) : ''}
        ${S.checkins[k] && S.checkins[k].sleep ? row('Your check-in', `Sleep ${SLEEP_WORDS[S.checkins[k].sleep - 1].toLowerCase()}, energy ${ENERGY_WORDS[(S.checkins[k].energy || 3) - 1].toLowerCase()}`) : ''}
      </div>
      <div class="callout">${icon('info', 'sm')}<span>“Usual” is your own median over the last four weeks, not a population norm. This is a guide to how hard to train today. It isn’t a medical measurement, and Steady doesn’t use it to diagnose anything.</span></div>
      <p class="cap ter">${S.health.sample ? 'Sample Fitbit data.' : S.health.connected ? 'Fitbit, ' + healthLabel().toLowerCase() + '.' : 'Fitbit not connected.'}</p>`;
  } });
};

/* ---------- nudges ---------- */
function nudgesSection(k) {
  const out = [], h = new Date().getHours();
  if (S.settings.nudges.protein && h >= 13) { const ph = proteinHint(k); if (ph) out.push({ ic: 'egg', t: `About ${ph.short} g of protein to go`, s: ph.text, btn: `<button class="btn sm tint" data-a="logTopup" data-f="${ph.add.food}" data-g="${ph.add.g}">Log it when eaten</button>` }); }
  if (S.settings.nudges.useSoon) for (const u of useSoonItems().slice(0, 1)) out.push({ ic: 'clock', t: `Use the ${lc(shortFoodName(u.fid))} ${u.left === 0 ? 'today' : 'by tomorrow'}`, s: cap(u.tip) + '.', btn: `<button class="btn sm quiet" data-a="usedUp" data-ws="${u.ws}" data-f="${u.fid}">Done</button>` });
  const rep = repeatedMeals()[0];
  if (rep) out.push({ ic: 'bookmark', t: 'Save a meal you have often?', s: `You’ve had ${lc(rep.last.name)} ${rep.n} times. Saved, it’s one tap to log and Steady plans it more often.`, btn: `<button class="btn sm tint" data-a="saveRepeat" data-sig="${esc(rep.sig)}">Save it</button><button class="btn sm text" data-a="dismiss" data-id="rep-${esc(rep.sig)}">Not now</button>` });
  const lastWs = addDays(weekStart(k), -7);
  if (S.settings.nudges.weekly && !S.reviewed[lastWs] && (dow(k) <= 1)) out.push({ ic: 'calendar-check', t: 'Your week in review', s: 'What went well last week, your numbers, and one thing to focus on.', btn: `<button class="btn sm tint" data-a="weekReview" data-ws="${lastWs}">Open</button>` });
  const rv = targetReview();
  if (rv.newKcal && !S.dismissed['tgt-' + weekStart(k)]) out.push({ ic: 'scale', t: rv.kind === 'maintain' ? 'Time to move to maintenance' : 'A small calorie change would help', s: rv.text, btn: `<button class="btn sm tint" data-a="applyTarget" data-v="${rv.newKcal}" data-kind="${rv.kind}">Change to ${fmtInt(rv.newKcal)} kcal</button><button class="btn sm text" data-a="dismiss" data-id="tgt-${weekStart(k)}">Not now</button>` });
  if (travelOn(k)) out.push({ ic: 'luggage', t: 'Travel mode is on', s: `Simple meals and hotel-room sessions${S.profile.travel.until ? ' until ' + fmtDay(S.profile.travel.until, { noRelative: true }) : ''}.`, btn: '<button class="btn sm quiet" data-a="travelOff">Turn off</button>' });
  if (!out.length) return '';
  return `<section class="section"><div class="sh"><h2 class="h2">Worth knowing</h2></div><div class="group divided">${out.slice(0, 3).map(n => `<div class="item tall nudge" style="align-items:flex-start"><span class="ic">${icon(n.ic, 'sm')}</span><div class="grow stack-s"><div class="t">${esc(n.t)}</div><div class="s">${esc(n.s)}</div><div class="row wrap" style="gap:8px;margin-top:6px">${n.btn}</div></div></div>`).join('')}</div></section>`;
}
A.logTopup = d => { logFood(todayKey(), d.f, +d.g, 'snack'); refresh(); toast(`${shortFoodName(d.f)} added`, { undo: () => { const L = dayLog(todayKey()); L.items.pop(); save(); } }); };
A.usedUp = d => { const st = shopState(d.ws); st.st[d.f] = st.st[d.f] || {}; st.st[d.f].usedUp = true; save(); refresh(); };
A.dismiss = d => { S.dismissed[d.id] = todayKey(); save(); refresh(); };
A.applyTarget = d => { applyTarget(+d.v, d.kind); if (d.kind === 'maintain') S.profile.phase = 'maintain'; save(); refresh(); toast(`Daily target is now ${fmtInt(+d.v)} kcal`); };
A.travelOff = () => { S.profile.travel = { on: false, until: null }; save(); refresh(); toast('Travel mode off'); };
A.saveRepeat = d => {
  const rep = repeatedMeals().find(r => r.sig === d.sig); if (!rep) return;
  openSaveMine({ name: rep.last.name, slot: rep.last.slot && SLOTS.includes(rep.last.slot) ? rep.last.slot : 'lunch', parts: rep.last.parts });
};

/* ---------- check-in ---------- */
let CI = null;
A.checkin = d => {
  const k = (d && d.k) || todayKey(), y = addDays(k, -1);
  const cur = S.checkins[k] || {};
  CI = { k, sleep: cur.sleep || null, energy: cur.energy || null, mood: cur.mood || null, hunger: cur.hunger || null, sym: Object.assign({}, cur.sym || {}), tags: ((S.checkins[y] || {}).tags || []).slice(), note: cur.note || '' };
  openSheet({ key: 'checkin', title: k === todayKey() ? 'Morning check-in' : 'Check-in, ' + fmtDay(k), body: checkinBody, foot: () => `<button class="btn" data-a="saveCheckin">Save check-in</button>` });
};
function checkinBody() {
  const fl = S.health.days[CI.k] && S.health.days[CI.k].sleepMin != null ? `<p class="hint">Fitbit recorded ${fmtHM(S.health.days[CI.k].sleepMin)} asleep.</p>` : '';
  return `<div class="field"><span class="lbl">How did you sleep?</span>${scaleHTML('sleep', CI.sleep, SLEEP_WORDS, 'ciPick')}${fl}</div>
    <div class="field"><span class="lbl">Energy this morning</span>${scaleHTML('energy', CI.energy, ENERGY_WORDS, 'ciPick')}</div>
    <div class="field"><span class="lbl">Mood</span>${scaleHTML('mood', CI.mood, MOOD_WORDS, 'ciPick')}</div>
    <div class="field"><span class="lbl">Symptoms since yesterday</span><p class="hint">Tap once for mild, again for moderate or strong.</p>
      <div class="chips">${SYMPTOMS.map(s => { const v = CI.sym[s.id] || 0; return `<button class="chip" data-a="ciSym" data-id="${s.id}" aria-pressed="${v > 0}">${s.label}${v ? `<span class="dots">${[1, 2, 3].map(i => `<i class="${i <= v ? 'on' : ''}"></i>`).join('')}</span>` : ''}</button>`; }).join('')}</div></div>
    <div class="field"><span class="lbl">Yesterday included</span><p class="hint">Optional. Used only to spot patterns with sleep and symptoms.</p>
      <div class="chips">${DAY_TAGS.map(t => chip(t.label, CI.tags.includes(t.id), 'ciTag', `data-id="${t.id}"`)).join('')}</div></div>
    <div class="field"><label for="ci-note">Anything else</label><input id="ci-note" data-in="ciNote" value="${esc(CI.note)}" placeholder="Optional note"></div>`;
}
A.ciPick = d => { CI[d.n] = CI[d.n] === +d.v ? null : +d.v; refreshSheet(); };
A.ciSym = d => { CI.sym[d.id] = ((CI.sym[d.id] || 0) + 1) % 4; if (!CI.sym[d.id]) delete CI.sym[d.id]; refreshSheet(); };
A.ciTag = d => { CI.tags = CI.tags.includes(d.id) ? CI.tags.filter(x => x !== d.id) : CI.tags.concat(d.id); refreshSheet(); };
A.ciNote = (d, el) => { CI.note = el.value; };
A.saveCheckin = () => {
  const y = addDays(CI.k, -1);
  S.checkins[CI.k] = Object.assign(S.checkins[CI.k] || {}, { sleep: CI.sleep, energy: CI.energy, mood: CI.mood, hunger: CI.hunger, sym: CI.sym, note: CI.note });
  if (CI.tags.length || S.checkins[y]) { S.checkins[y] = S.checkins[y] || {}; S.checkins[y].tags = CI.tags; }
  save(); closeSheet(); refresh();
  const rd = readiness(CI.k);
  toast(rd.level === 'low' ? 'Saved. Today’s plan is a walk and a stretch.' : rd.level === 'steady' ? 'Saved. Today’s training is set to a moderate effort.' : 'Check-in saved');
};

/* ---------- weigh-in ---------- */
A.weigh = d => {
  const lw = latestWeight();
  const st = { k: (d && d.k) || todayKey(), kg: S.weights[(d && d.k) || todayKey()] || (lw ? lw.kg : S.profile.weightKg) || 60, waist: '' };
  openSheet({ title: 'Weight', body: () => `<div class="field"><span class="lbl">This morning</span>${stepper('w-kg', fmtKg(st.kg), 0.1, 'kg', 'stepNum', 'data-in="wKg"')}</div>
      <div class="field"><label for="w-waist">Waist, if you measure it</label><input id="w-waist" inputmode="decimal" placeholder="cm, optional" value="${st.waist}" data-in="wWaist"></div>
      <div class="callout">${icon('info', 'sm')}<span>Weigh first thing, after the loo and before eating. Day-to-day changes are mostly water; Steady follows your 7-day average.</span></div>`,
    foot: () => `<button class="btn" data-a="saveWeight">Save</button>` });
  A.wKg = (dd, el) => { const v = num(el.value); if (v) st.kg = v; };
  A.wWaist = (dd, el) => { st.waist = el.value; };
  A.saveWeight = () => {
    if (!(st.kg > 25 && st.kg < 250)) { toast('Check the number: that looks out of range'); return; }
    S.weights[st.k] = round(st.kg, 0.1);
    const w = num(st.waist); if (w && w > 40 && w < 200) S.waist[st.k] = w;
    save(); closeSheet(); refresh();
    const tr = weightTrend();
    toast(tr && tr.entries > 3 ? `Saved. 7-day average ${fmtKg(tr.current)} kg` : 'Weight saved');
  };
};

SCREENS.food = () => {
  const v = UI.view.food;
  const body = { diary: diaryView, plan: planView, kitchen: kitchenView, meals: mealsView }[v] || diaryView;
  return `${header({ title: 'Food', actions: `<button class="icon-btn acc" data-a="addMeal" aria-label="Add meal">${icon('plus')}</button>` })}
    
    ${seg('view.food', [['diary', 'Diary'], ['plan', 'Plan'], ['kitchen', 'Kitchen'], ['meals', 'Meals']], v)}
    ${body()}`;
};

function weekStrip(sel, a, pip) {
  const ws = weekStart(sel), we = addDays(ws, 6);
  const label = ws === weekStart(todayKey()) ? 'This week' : ws === addDays(weekStart(todayKey()), 7) ? 'Next week' : ws === addDays(weekStart(todayKey()), -7) ? 'Last week' : `${fmtDate(ws)} to ${fmtDate(we)}`;
  return `<div class="stack-s"><div class="row between"><button class="icon-btn" data-a="${a}" data-v="${addDays(sel, -7)}" aria-label="Previous week">${icon('chevron-left')}</button><span class="small semi">${label}</span><button class="icon-btn" data-a="${a}" data-v="${addDays(sel, 7)}" aria-label="Next week">${icon('chevron-right')}</button></div>
    <div class="week7">${weekDays(ws).map(d => `<button class="wd" data-a="${a}" data-v="${d}" aria-pressed="${d === sel}" aria-label="${fmtDay(d, { noRelative: true })}"><span>${DOW_SHORT[dow(d)]}</span><span class="n">${fromKey(d).getDate()}</span><span class="pip ${pip ? pip(d) : ''}"></span></button>`).join('')}</div></div>`;
}

/* ---------- diary ---------- */
A.foodDay = d => { UI.foodDay = d.v; refresh(); };
function diaryView() {
  const k = UI.foodDay || todayKey(), T = S.targets, L = S.log[k] || { items: [] }, e = eatenTotals(k);
  const est = L.items.some(i => i.est);
  const pip = d => { const n = (S.log[d] || { items: [] }).items.length; return n >= 3 ? 'ok' : n ? 'part' : ''; };
  const future = k > todayKey();
  const slots = ['breakfast', 'lunch', 'snack', 'dinner', 'treat', 'extra'];
  const groups = slots.map(slot => {
    const logged = L.items.filter(i => (i.slot || 'extra') === slot);
    const planned = k >= todayKey() ? ((S.plan[k] || {}).meals || []).filter(m => m.slot === slot && !isEaten(k, m.id)) : [];
    if (!logged.length && !planned.length && !['breakfast', 'lunch', 'dinner'].includes(slot)) return '';
    const kc = sum(logged.map(i => i.n.k));
    const rows = logged.map(it => `<button class="item" data-a="logItem" data-k="${k}" data-id="${it.id}" style="align-items:flex-start">
        ${it.photo ? `<span class="photo thumb"><img src="${it.photo}" alt=""></span>` : ''}
        <div class="grow"><div class="t">${esc(it.name)}</div><div class="s">${Math.round(it.n.p)} g protein${it.portion && it.portion !== 1 ? ', ' + portionLabel(it.portion) : ''}${it.est ? ', estimated' : ''}</div>${it.parts && it.parts.length && !it.photo ? `<div style="margin-top:8px;max-width:160px">${spectrum(it.parts)}</div>` : ''}</div>
        <div class="v num">${fmtInt(it.n.k)}</div></button>`).join('')
      + planned.map(m => { const r = mealRecipe(m.r), n = mealNut(m); return `<div class="item" style="align-items:flex-start"><button class="grow tappable" data-a="planMeal" data-k="${k}" data-id="${m.id}" style="text-align:left"><div class="t sec">${esc(r.name)}</div><div class="s">Planned, ${fmtInt(n.k)} kcal, ${Math.round(n.p)} g protein</div></button>${future ? '' : `<button class="tick" data-a="tickMeal" data-k="${k}" data-id="${m.id}" aria-pressed="false" aria-label="Mark eaten">${icon('check', 'sm')}</button>`}</div>`; }).join('');
    return `<div class="stack-s"><div class="row between" style="padding:0 4px"><span class="h3">${SLOT_LABEL[slot]}</span><span class="small sec num">${kc ? fmtInt(kc) + ' kcal' : ''}${future ? '' : ` <button class="link" data-a="addMeal" data-slot="${slot}" data-k="${k}" style="margin-left:10px">Add</button>`}</span></div>
      <div class="group">${rows || `<div class="item"><span class="s">Nothing logged</span></div>`}</div></div>`;
  }).join('');
  const ws = weekStatus(k), msg = weekMessage(ws);
  return `${weekStrip(k, 'foodDay', pip)}
    <div class="group">
      <div class="macros"><div><b>${fmtInt(e.k)}</b><span>of ${fmtInt(T.kcal)} kcal</span></div><div><b>${Math.round(e.p)} g</b><span>protein</span></div><div><b>${Math.round(e.c)} g</b><span>carbs</span></div><div><b>${Math.round(e.f)} g</b><span>fat</span></div></div>
      <div class="item" style="min-height:0;border-top:1px solid var(--line)"><span class="s grow">Fibre ${Math.round(e.fb)}&nbsp;g, calcium ${fmtInt(round(e.ca, 10))}&nbsp;mg, saturated fat ${Math.round(e.sf)}&nbsp;g</span>${est ? estTag('Includes typical portions or photo estimates') : ''}</div>
